<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>강승원 · 성장 기록</title>
<style>
  /* 색상은 dataviz 검증기 통과값. 파랑=진행, 주황=연속기록, 청록=완료.
     세 색은 all-pairs 색맹 분리 ΔE 9.4 / 일반 20.9 로 통과한다. */
  :root {
    color-scheme: dark;
    --page:      #0d0d12;
    --card:      #16161d;
    --raised:    #1e1e28;
    --line:      #272733;
    --track:     #313142;  /* 진행 트랙. 카드 위에서 확실히 보여야 링이 링으로 읽힌다 */
    --text:      #f4f4f8;
    --muted:     #9c9cab;
    --faint:     #6b6b7a;

    --accent:    #3987e5;  /* 진행 */
    --streak:    #d95926;  /* 연속 */
    --done:      #199e70;  /* 완료 */
    --urgent:    #d03b3b;  /* 마감 임박 */

    --heat-0:    #1c1c25;
    --heat-1:    #1c5cab;
    --heat-2:    #256abf;
    --heat-3:    #3987e5;
    --heat-4:    #86b6ef;

    --r:         16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 96px;
    overscroll-behavior-y: contain;
  }

  /* 화면 위쪽에 은은한 빛. 고정이라 스크롤해도 배경에 남는다. */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(760px 460px at 12% -8%,  color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(620px 420px at 92% 4%,   color-mix(in srgb, var(--streak) 14%, transparent), transparent 68%),
      radial-gradient(680px 520px at 50% 34%,  color-mix(in srgb, var(--done)   10%, transparent), transparent 72%);
  }

  /* 카드가 아래에서 살짝 올라오며 나타난다. --i 로 순서를 준다. */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  main > * {
    animation: riseIn .42s cubic-bezier(.2,.8,.3,1) both;
    animation-delay: calc(var(--i, 0) * 45ms);
  }

  /* ---------- 헤더 ---------- */

  header {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; }
  .bar h1 {
    margin: 0; font-size: 1rem; font-weight: 750; letter-spacing: -.02em;
    background: linear-gradient(92deg, #fff 10%, #9ec5f4 60%, #86b6ef);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .bar .spacer { flex: 1; }

  .streakchip {
    display: flex; align-items: center; gap: 5px;
    background: color-mix(in srgb, var(--streak) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--streak) 45%, transparent);
    color: var(--streak);
    border-radius: 999px; padding: 5px 12px;
    font-size: .78rem; font-weight: 750;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 16px -4px color-mix(in srgb, var(--streak) 60%, transparent);
  }
  .streakchip.hot { animation: emberPulse 2.4s ease-in-out infinite; }
  @keyframes emberPulse {
    0%, 100% { box-shadow: 0 0 14px -5px color-mix(in srgb, var(--streak) 55%, transparent); }
    50%      { box-shadow: 0 0 22px -2px color-mix(in srgb, var(--streak) 85%, transparent); }
  }

  nav {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px;
    /* 오른쪽 페이드로 더 스크롤된다는 걸 알린다 */
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 28px), transparent 100%);
            mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 28px), transparent 100%);
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 0 0 auto; cursor: pointer; font-family: inherit;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: .82rem;
    transition: background .15s, color .15s;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  main { padding: 16px; display: grid; gap: 12px; }

  /* ---------- 카드 ---------- */

  .card {
    position: relative;
    background:
      linear-gradient(168deg, color-mix(in srgb, #fff 4%, transparent), transparent 46%),
      var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px -18px rgba(0,0,0,.9);
  }
  /* 카드 윗변에 가느다란 빛줄기 */
  .card::before {
    content: '';
    position: absolute; left: 14%; right: 14%; top: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 55%, transparent), transparent);
    opacity: .55;
  }
  .card > h2 {
    margin: 0 0 14px; font-size: .8rem; font-weight: 650;
    color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
  }

  /* ---------- 레벨 히어로 ---------- */

  /* 레벨 카드는 더 세게 — 여기가 첫인상이다 */
  .herocard {
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 58%),
      radial-gradient(120% 140% at 100% 100%, color-mix(in srgb, var(--streak) 13%, transparent), transparent 58%),
      var(--card);
    border-color: color-mix(in srgb, var(--accent) 26%, var(--line));
    overflow: hidden;
  }
  .herocard::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 70% at 18% 20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }
  .herocard > * { position: relative; z-index: 1; }

  .hero { display: flex; align-items: center; gap: 16px; }
  .lvlring { position: relative; flex: 0 0 auto; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 40%, transparent)); }

  .tier {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .7rem; font-weight: 750; letter-spacing: .06em;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 6px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .lvlring .num {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .lvlring .num b { font-size: 1.7rem; font-weight: 700; letter-spacing: -.03em; }
  .lvlring .num span { font-size: .58rem; color: var(--faint); margin-top: 3px; letter-spacing: .1em; }

  .herobody { flex: 1; min-width: 0; }
  .herobody .xp { font-size: .95rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .herobody .next { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .xptrack {
    height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4) inset;
  }
  .xpfill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--accent), #6fb2ff 65%, #9ad0ff);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: width .8s cubic-bezier(.2,.8,.3,1);
    position: relative; overflow: hidden;
  }
  /* 게이지 위를 훑고 지나가는 빛 */
  .xpfill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.5) 50%, transparent 80%);
    transform: translateX(-100%);
    animation: sweep 2.6s ease-in-out 0.6s infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-100%) } 55%, 100% { transform: translateX(220%) } }

  /* ---------- 퀘스트 ---------- */

  .quest {
    display: flex; align-items: center; gap: 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform .12s, border-color .15s;
  }
  .quest:last-child { margin-bottom: 0; }
  .quest:active { transform: scale(.985); }
  .quest .ico { font-size: 1.15rem; flex: 0 0 auto; width: 24px; text-align: center; }
  .quest .qt { flex: 1; min-width: 0; }
  .quest .qt .t { font-size: .88rem; font-weight: 550; }
  .quest .qt .s { font-size: .74rem; color: var(--faint); margin-top: 1px; }
  .quest .xpbadge {
    flex: 0 0 auto; font-size: .72rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .quest.cleared { border-color: color-mix(in srgb, var(--done) 45%, transparent); cursor: default; }
  .quest.cleared .qt .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .quest.cleared .xpbadge { color: var(--done); }

  /* ---------- 스탯 링 ---------- */

  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ringcell {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: var(--raised); border-radius: 12px; padding: 13px 6px 11px;
  }
  .ringcell .lab { font-size: .72rem; color: var(--muted); text-align: center; line-height: 1.25; }
  .ringcell .val { font-size: .68rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ringwrap { position: relative; }
  .ringwrap .pctxt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .ringwrap .emo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

  /* ---------- 히트맵 ---------- */

  .heat {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(7, 1fr); grid-auto-columns: 1fr;
    gap: 3px;
  }
  .heat i {
    width: auto; aspect-ratio: 1; border-radius: 3px;
    background: var(--heat-0); display: block;
    transition: transform .18s;
  }
  /* 활동이 많은 칸은 살짝 빛난다 */
  .heat i.lit { box-shadow: 0 0 8px -1px color-mix(in srgb, var(--accent) 65%, transparent); }
  .heat i.today { outline: 1.5px solid var(--streak); outline-offset: 1px; }
  .heatlegend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 10px; font-size: .68rem; color: var(--faint); }
  .heatlegend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

  /* ---------- 업적 ---------- */

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .badge {
    position: relative; overflow: hidden;
    background: var(--raised); border-radius: 12px; padding: 12px 8px;
    text-align: center; opacity: .3; filter: grayscale(1);
    transition: opacity .2s, filter .2s, transform .2s;
  }
  .badge.got {
    opacity: 1; filter: none;
    border: 1px solid color-mix(in srgb, var(--done) 40%, transparent);
    background:
      radial-gradient(90% 90% at 50% 0%, color-mix(in srgb, var(--done) 18%, transparent), transparent 70%),
      var(--raised);
    box-shadow: 0 0 18px -6px color-mix(in srgb, var(--done) 55%, transparent);
  }
  .badge.got .e { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--done) 60%, transparent)); }
  /* 획득한 배지에만 훑고 지나가는 반짝임 */
  .badge.got::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
    transform: translateX(-160%);
    animation: shine 4.5s ease-in-out infinite;
    animation-delay: calc(var(--b, 0) * 240ms);
  }
  @keyframes shine { 0% { transform: translateX(-160%) } 30%, 100% { transform: translateX(320%) } }
  .badge .e { font-size: 1.4rem; line-height: 1; }
  .badge .n { font-size: .68rem; margin-top: 6px; color: var(--muted); line-height: 1.25; }

  /* ---------- 리스트 아이템 ---------- */

  .item { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .item:last-child { border-bottom: none; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { font-size: .74rem; color: var(--faint); margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .dot.high { background: var(--urgent); }
  .dot.medium { background: var(--streak); }
  .dot.low { background: var(--faint); }

  .row { margin-bottom: 15px; }
  .row:last-child { margin-bottom: 0; }
  .rowtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .85rem; margin-bottom: 6px; }
  .rowtop .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowtop .v { color: var(--muted); flex: 0 0 auto; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
  .fill.full { background: var(--done); }

  /* ---------- 버튼 / 폼 ---------- */

  button.mini {
    background: var(--raised); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 12px; font-size: .78rem; font-family: inherit;
    cursor: pointer; flex: 0 0 auto;
  }
  button.mini:active { background: var(--line); }
  button.mini.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.mini.ok { background: var(--done); border-color: var(--done); color: #fff; font-weight: 600; }
  button.mini.danger { color: var(--urgent); }

  label { display: block; font-size: .76rem; color: var(--muted); margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; background: var(--raised); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px;
    font-size: 16px; font-family: inherit; /* 16px 미만이면 모바일에서 확대된다 */
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 68px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button.submit {
    width: 100%; margin-top: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 11px; padding: 13px;
    font-size: .93rem; font-weight: 650; font-family: inherit; cursor: pointer;
  }
  button.submit:disabled { opacity: .5; }

  details summary { cursor: pointer; font-size: .84rem; color: var(--accent); font-weight: 600; padding: 4px 0; list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  .empty { color: var(--faint); font-size: .83rem; padding: 4px 0; }
  .err { color: var(--urgent); font-size: .84rem; }

  /* ---------- 수정 시트 ---------- */

  .sheetback {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end;
    opacity: 0; transition: opacity .2s;
  }
  .sheetback.open { opacity: 1; }
  .sheet {
    width: 100%; max-height: 88vh; overflow-y: auto;
    background: var(--card);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(20px); transition: transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .sheetback.open .sheet { transform: translateY(0); }
  .sheethead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .sheethead h3 { margin: 0; font-size: .98rem; font-weight: 650; }

  /* ---------- 노트 · 막힌 것 카드 ---------- */

  .entry {
    background: var(--raised); border: 1px solid var(--line);
    border-radius: 13px; padding: 13px 14px; margin-bottom: 9px;
  }
  .entry:last-child { margin-bottom: 0; }
  .entry .eh { display: flex; align-items: flex-start; gap: 9px; }
  .entry .eh .et { flex: 1; min-width: 0; font-size: .9rem; font-weight: 600; line-height: 1.35; }
  .entry .src { font-size: .72rem; color: var(--faint); margin-top: 3px; }
  /* .entry 밖(복습 화면 등)에서도 쓰이므로 스코프를 두지 않는다 */
  .field { margin-top: 10px; }
  .field .k {
    font-size: .68rem; color: var(--faint); letter-spacing: .05em;
    text-transform: uppercase; margin-bottom: 3px;
  }
  .field .v { font-size: .84rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .field.act { border-left: 2px solid var(--accent); padding-left: 9px; }
  .field.sol { border-left: 2px solid var(--done); padding-left: 9px; }
  .entry .acts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: .68rem; font-weight: 650; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto;
  }
  .pill.open   { color: var(--streak); border-color: color-mix(in srgb, var(--streak) 45%, transparent); }
  .pill.trying { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .pill.solved { color: var(--done);   border-color: color-mix(in srgb, var(--done) 45%, transparent); }
  .pill.applied{ color: var(--done);   border-color: color-mix(in srgb, var(--done) 45%, transparent); }

  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    flex: 0 0 auto; cursor: pointer; font-family: inherit;
    background: var(--raised); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font-size: .76rem;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 110px);
    background: var(--raised); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 999px; font-size: .85rem; font-weight: 550;
    transition: transform .3s cubic-bezier(.2,.8,.3,1); z-index: 60; max-width: 88vw; text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast.good { border-color: var(--done); color: var(--done); }
  #toast.bad { border-color: var(--urgent); color: var(--urgent); }

  @keyframes pop { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .pop { animation: pop .28s cubic-bezier(.2,.9,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>강승원 · 성장 기록</h1>
    <div class="spacer"></div>
    <div class="streakchip" id="streakchip">🔥 0일</div>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="view"></main>
<div id="toast"></div>

<script>
/* ============ 설정 ============ */

const TABS = [
  { id: 'home',      label: '홈' },
  { id: 'mastery',   label: '🧠 숙달' },
  { id: 'selfcheck', label: '🪞 메타인지' },
  { id: 'notes',    label: '📝 노트' },
  { id: 'blockers', label: '🧩 막힌 것' },
  { id: 'people',   label: '🤝 사람' },
  { id: 'ideas',    label: '💡 아이디어' },
  { id: 'books',    label: '📖 독서' },
  { id: 'courses',  label: '📚 강의' },
  { id: 'fitness',  label: '💪 운동' },
  { id: 'mindpick', label: '📱 마인드픽' },
  { id: 'military', label: '🪖 전역' }
];

/* 행동 하나당 경험치. 어려운 일일수록 크게. */
const XP = {
  lecture: 10, workout: 20, page: 0.5, post: 30, task: 25, book: 60,
  note: 15, applied: 25, solved: 40, person: 15, idea: 5, shipped: 50,
  card: 5, review: 3, unaided: 20, check: 20
};

const el = (tag, cls, text) => {

};
const pct = (a, b) => (b ? Math.min(100, Math.round((a / b) * 100)) : 0);
const iso = (d) => d.toISOString().slice(0, 10);
const today = () => iso(new Date());

/* ============ 경험치 · 레벨 ============ */

function total(d) {
  let xp = 0;
  for (const c of d.courses)   xp += (+c.completed_lectures || 0) * XP.lecture;
  for (const f of d.fitness)   xp += XP.workout;
  for (const b of d.books) {
    xp += Math.round((+b.current_page || 0) * XP.page);
    if (b.status === 'finished') xp += XP.book;
  }
  for (const m of d.mindpick)  xp += XP.post;
  for (const t of d.military)  if (t.status === 'done') xp += XP.task;
  for (const n of d.notes)     xp += XP.note + (n.applied ? XP.applied : 0);
  for (const b of d.blockers)  if (b.status === 'solved') xp += XP.solved;
  for (const p of d.people)    xp += XP.person;
  for (const i of d.ideas)     xp += XP.idea + (i.status === 'shipped' ? XP.shipped : 0);
  for (const m of d.mastery)   xp += XP.card + (m.reps || 0) * XP.review + (m.unaided_count || 0) * XP.unaided;
  for (const s of d.selfcheck) xp += XP.check;
  return Math.round(xp);
}

/* 레벨 N → N+1 에 필요한 경험치: 100 + (N-1)*60 */
function levelOf(xp) {
  let level = 1, rest = xp, need = 100;
  while (rest >= need) { rest -= need; level++; need = 100 + (level - 1) * 60; }
  return { level, into: rest, need };
}

/* ============ 활동일 · 연속 기록 ============ */

function activityMap(d) {
  const m = new Map();
  const add = (v) => {
    if (!v) return;
    const day = String(v).slice(0, 10);
    m.set(day, (m.get(day) || 0) + 1);
  };
  d.fitness.forEach(r => add(r.date));
  d.mindpick.forEach(r => add(r.post_date));
  d.books.forEach(r => { add(r.finished_at); add(r.started_at); });
  d.military.forEach(r => add(r.completed_at));
  d.courses.forEach(r => add(r.created_at));
  d.notes.forEach(r => add(r.created_at));
  d.blockers.forEach(r => { add(r.created_at); add(r.solved_at); });
  d.people.forEach(r => { add(r.met_at); add(r.last_contact); });
  d.ideas.forEach(r => add(r.created_at));
  d.mastery.forEach(r => add(r.last_review));
  d.drills.forEach(r => add(r.date));
  d.selfcheck.forEach(r => add(r.date));
  return m;
}

function streakOf(d) {
  const m = activityMap(d);
  if (!m.size) return 0;
  // 오늘 아직 기록이 없어도 어제까지 이어졌으면 연속으로 친다.
  let cur = new Date();
  if (!m.has(iso(cur))) cur.setDate(cur.getDate() - 1);
  let n = 0;
  while (m.has(iso(cur))) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}

const ENDPOINTS = ['courses', 'fitness', 'books', 'mindpick', 'military', 'notes', 'blockers',
                   'people', 'ideas', 'mastery', 'drills', 'selfcheck'];
let DATA = null;
let current = 'home';

async function api(path, options) {
  const res = await fetch('/api/' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

async function loadAll(force) {
  if (DATA && !force) return DATA;
  const [lists, settings] = await Promise.all([
    Promise.all(ENDPOINTS.map(n => api(n))),
    api('settings').catch(() => ({}))
  ]);
  DATA = {};
  ENDPOINTS.forEach((n, i) => { DATA[n] = Array.isArray(lists[i]) ? lists[i] : []; });
  DATA.settings = settings || {};
  return DATA;
}

/* 복무 진행 상황. 입대일·전역일이 없으면 null. */
function service(d) {
  const s = d.settings || {};
  if (!s.service_start || !s.service_end) return null;
  const start = new Date(s.service_start + 'T00:00:00');
  const end = new Date(s.service_end + 'T00:00:00');
  const now = new Date(today() + 'T00:00:00');
  const day = Math.floor((now - start) / 86400000) + 1;   // 입대일이 1일차
  const left = Math.ceil((end - now) / 86400000);
  const totalDays = Math.floor((end - start) / 86400000) + 1;
  return { start: s.service_start, end: s.service_end, day, left, totalDays, pct: pct(day, totalDays) };
}

async function save(name, body, msg) {
  await api(name, { method: 'POST', body: JSON.stringify(body) });

let ringSeq = 0;

/* 진행률 링. 그라데이션 획 + 0에서 차오르는 애니메이션. */
function ring(value, size, width, color) {
  const r = (size - width) / 2;
  const circ = 2 * Math.PI * r;
  const ns = 'http://www.w3.org/2000/svg';
  const id = 'rg' + (++ringSeq);
  const full = value >= 100;

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.style.display = 'block';
  svg.style.transform = 'rotate(-90deg)';

  const defs = document.createElementNS(ns, 'defs');
  const grad = document.createElementNS(ns, 'linearGradient');
  grad.setAttribute('id', id);
  grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
  grad.setAttribute('x2', '1'); grad.setAttribute('y2', '1');
  const stops = full ? ['#199e70', '#3fd39a'] : ['#3987e5', '#8fc7ff'];
  stops.forEach((c, i) => {
    const s = document.createElementNS(ns, 'stop');
    s.setAttribute('offset', i ? '100%' : '0%');
    s.setAttribute('stop-color', c);
    grad.append(s);
  });
  defs.append(grad);
  svg.append(defs);

  const bg = document.createElementNS(ns, 'circle');
  bg.setAttribute('cx', size / 2); bg.setAttribute('cy', size / 2); bg.setAttribute('r', r);
  bg.setAttribute('fill', 'none');
  bg.setAttribute('stroke', 'var(--track)');
  bg.setAttribute('stroke-width', width);

  const fg = document.createElementNS(ns, 'circle');
  fg.setAttribute('cx', size / 2); fg.setAttribute('cy', size / 2); fg.setAttribute('r', r);
  fg.setAttribute('fill', 'none');
  fg.setAttribute('stroke', color || `url(#${id})`);
  fg.setAttribute('stroke-width', width);
  fg.setAttribute('stroke-linecap', 'round');
  fg.setAttribute('stroke-dasharray', circ);
  fg.setAttribute('stroke-dashoffset', circ);   // 빈 상태에서 시작
  fg.style.transition = 'stroke-dashoffset .9s cubic-bezier(.2,.8,.3,1)';
  fg.style.filter = `drop-shadow(0 0 ${Math.max(3, width * 0.7)}px ${full ? 'rgba(25,158,112,.7)' : 'rgba(57,135,229,.65)'})`;

  svg.append(bg, fg);
  requestAnimationFrame(() => {
    fg.setAttribute('stroke-dashoffset', circ * (1 - Math.min(1, value / 100)));
  });
  return svg;
}

/* 숫자가 0에서 올라간다. 큰 값만 쓸 것. */
function countUp(node, to, suffix) {
  const dur = 900, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = num(Math.round(to * eased)) + (suffix || '');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function bar(parent, name, done, tot, valueText) {

function form(fields, onSubmit, submitLabel) {
  const wrap = el('div');
  const inputs = {};
  const build = (f) => {
    const holder = el('div');
    holder.append(el('label', null, f.label));
    let input;
    if (f.type === 'select') {
      input = el('select');
      f.options.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; input.append(o); });
    } else if (f.type === 'textarea') {
      input = el('textarea');
    } else {
      input = el('input');
      input.type = f.type || 'text';
      if (f.step) input.step = f.step;
      if (f.type === 'number') input.inputMode = 'decimal';
    }
    if (f.value !== undefined) input.value = f.value;
    if (f.placeholder) input.placeholder = f.placeholder;
    inputs[f.key] = input;
    holder.append(input);
    return holder;
  };
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i], next = fields[i + 1];
    if (f.half && next && next.half) {
      const pair = el('div', 'two');
      pair.append(build(f), build(next));
      wrap.append(pair);
      i++;
    } else wrap.append(build(f));
  }
  const btn = el('button', 'submit', submitLabel || '추가');
  btn.onclick = async () => {
    const body = {};
    for (const [k, input] of Object.entries(inputs)) {
      const v = input.value.trim();
      if (v !== '') body[k] = v;
    }
    btn.disabled = true; btn.textContent = '저장 중…';
    try { await onSubmit(body); }
    catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = submitLabel || '추가'; }
  };
  wrap.append(btn);
  return wrap;
}

/* 아래에서 올라오는 수정 시트. 기존 값을 채운 폼을 띄우고 PATCH 한다. */
function openEdit(title, fields, record, endpoint) {
  const back = el('div', 'sheetback');
  const sheet = el('div', 'sheet');
  const head = el('div', 'sheethead');
  head.append(el('h3', null, title));
  const x = el('button', 'mini', '닫기');
  x.onclick = () => back.remove();
  head.append(x);
  sheet.append(head);

  const filled = fields.map(f => ({ ...f, value: record[f.key] == null ? '' : String(record[f.key]) }));
  sheet.append(form(filled, async (body) => {
    // 비워둔 칸은 명시적으로 지운다. 안 그러면 한 번 쓴 값을 못 지운다.
    // 필수 칸(required)은 비워도 건드리지 않는다 — DB가 NOT NULL 이라 거절당한다.
    for (const f of fields) if (!(f.key in body) && !f.required) body[f.key] = '';
    await patch(endpoint, record.id, body, '수정했어');
    back.remove();
  }, '저장'));

  back.append(sheet);
  back.onclick = (e) => { if (e.target === back) back.remove(); };
  document.body.append(back);
  requestAnimationFrame(() => back.classList.add('open'));
}

  sc.append(g);
  view.append(sc);

  /* 히트맵 */
  const hc = card('최근 12주 기록');
  const map = activityMap(d);
  const grid = el('div', 'heat');
  const start = new Date();
  start.setDate(start.getDate() - 83);
  start.setDate(start.getDate() - start.getDay()); // 일요일에 맞춘다
  // grid-auto-flow: column + 7개 행이라, i번째 칸은 (i/7)주차의 (i%7)요일에 놓인다.
  for (let i = 0; i < 7 * 13; i++) {
    const cellDate = new Date(start);
    cellDate.setDate(start.getDate() + i);
    const key = iso(cellDate);
    const c = map.get(key) || 0;
    const box = el('i');
    box.style.background = c === 0 ? 'var(--heat-0)' : c === 1 ? 'var(--heat-1)' : c === 2 ? 'var(--heat-2)' : c <= 4 ? 'var(--heat-3)' : 'var(--heat-4)';
    box.title = `${key} · 기록 ${c}건`;
    if (c >= 3) box.classList.add('lit');
    if (key === today()) box.classList.add('today');
    if (cellDate > new Date()) box.style.visibility = 'hidden';
    grid.append(box);
  }
  hc.append(grid);
  const lg = el('div', 'heatlegend');
  lg.append(el('span', null, '적음'));
  ['var(--heat-0)','var(--heat-1)','var(--heat-2)','var(--heat-3)','var(--heat-4)'].forEach(c => {
    const i2 = el('i'); i2.style.background = c; lg.append(i2);
  });
  lg.append(el('span', null, '많음'));
  hc.append(lg);
  view.append(hc);

  /* 업적 */
  const ac = card(`업적 ${ACHIEVEMENTS.filter(a => a.test(d)).length} / ${ACHIEVEMENTS.length}`);
  const bg = el('div', 'badges');
  let got = 0;
  ACHIEVEMENTS.forEach(a => {
    const has = a.test(d);
    const b = el('div', 'badge' + (has ? ' got' : ''));
    if (has) b.style.setProperty('--b', got++);
    b.append(el('div', 'e', a.emo), el('div', 'n', a.name));
    bg.append(b);
  });
  ac.append(bg);
  view.append(ac);
}

/* 오늘 들고 나갈 한 가지.
   폰을 못 보는 시간에 쓰는 장치라, 앱은 나가기 전과 돌아온 뒤에만 쓴다.
   아침에 하나 고르고 → 일과 중엔 머리로만 굴리고 → 저녁에 회수한다. */
function carryCard(d) {
  const c = card('오늘 들고 나갈 한 가지');
  const drill = d.drills.find(x => x.date === today());

  if (!drill) {
    if (!d.mastery.length) {
      c.append(el('div', 'empty', '숙달 탭에 항목을 하나 넣으면 여기서 매일 하나씩 뽑아준다.'));
      return c;
    }
    /* 낮은 단계 · 복습일이 지난 것부터 */
    const pool = [...d.mastery].sort((a, b) => {
      const ad = (a.next_review || '9999') <= today() ? 0 : 1;
      const bd = (b.next_review || '9999') <= today() ? 0 : 1;
      return ad - bd || (a.level || 0) - (b.level || 0);
    });
    const pick = pool[0];
    c.append(el('div', 'empty', '일과 나가기 전에 하나만 골라. 오늘은 이것만 머리에 넣고 나간다.'));
    const e = el('div', 'entry');
    e.append(el('div', 'et', pick.term));
    if (pick.cue) e.append(el('div', 'src', '실마리 · ' + pick.cue));
    const b = el('button', 'submit', '이걸로 들고 나가기');
    b.onclick = () => save('drills', { date: today(), mastery_id: pick.id, term_snapshot: pick.term }, '오늘 이거 하나');
    e.append(b);
    c.append(e);
    return c;
  }

  const e = el('div', 'entry');
  const h = el('div', 'eh');
  h.append(el('div', 'et', drill.term_snapshot || '오늘의 항목'));
  if (drill.recalled != null) {
    h.append(el('span', 'pill ' + (drill.unaided ? 'solved' : drill.recalled ? 'trying' : 'open'),
      drill.unaided ? '무의식' : drill.recalled ? '떠올림' : '못 떠올림'));
  }
  e.append(h);

  if (drill.recalled == null) {
    e.append(el('div', 'src', '일과 끝나고 돌아와서 눌러.'));
    const acts = el('div', 'acts');
    const no = el('button', 'mini danger', '못 떠올렸다');
    no.onclick = () => patch('drills', drill.id, { recalled: false, unaided: false }, '기록했어');
    const yes = el('button', 'mini go', '떠올렸다');
    yes.onclick = () => patch('drills', drill.id, { recalled: true, unaided: false }, '기록했어');
    const un = el('button', 'mini ok', `안 보고 나왔다 (+${XP.unaided}XP)`);
    un.onclick = async () => {
      const cardRow = d.mastery.find(m => m.id === drill.mastery_id);
      if (cardRow) await gradeCard(cardRow, true, true);
      await patch('drills', drill.id, { recalled: true, unaided: true }, `+${XP.unaided} XP`);
    };
    acts.append(no, yes, un);
    e.append(acts);
  } else {
    e.append(el('div', 'src', drill.unaided
      ? '몸에 붙었다. 이 항목은 간격이 늘어난다.'
      : drill.recalled ? '떠올랐지만 아직 의식적으로. 반복하면 붙는다.' : '내일 다시 이 항목이 올라온다.'));
  }
  c.append(e);

  const streak7 = d.drills.filter(x => x.date >= daysAgo(6));
  const un7 = streak7.filter(x => x.unaided).length;
  c.append(el('div', 'empty', `최근 7일 · 들고 나간 날 ${streak7.length}일 · 무의식으로 나온 날 ${un7}일`));
  return c;
}

/* 오늘 할 만한 것을 데이터에서 뽑아낸다. */
function quests(d) {
  const t = today();
  const out = [];

  const course = d.courses.find(c => c.status !== 'done' && (+c.completed_lectures || 0) < (+c.total_lectures || 0));
  if (course) {
    out.push({
      emo: '📚', xp: XP.lecture,
      title: '강의 1강 듣기',
      sub: `${course.name} · ${course.completed_lectures || 0}/${course.total_lectures}강`,
      done: false,
      act: () => patch('courses', course.id, {
        completed_lectures: (+course.completed_lectures || 0) + 1,
        status: (+course.completed_lectures || 0) + 1 >= (+course.total_lectures || 0) ? 'done' : 'in_progress'
      }, `+${XP.lecture} XP`)
    });
  }

  const trained = d.fitness.some(f => f.date === t);
  out.push({
    emo: '💪', xp: XP.workout,
    title: '오늘 운동 기록',
    sub: trained ? '오늘 기록함' : '체중이나 운동 남기기',
    done: trained,
    act: () => goTab('fitness')
  });

  const reading = d.books.find(b => b.status === 'reading');
  if (reading) {
    out.push({
      emo: '📖', xp: 5,
      title: '10쪽 읽기',
      sub: `${reading.title} · ${reading.current_page || 0}쪽`,
      done: false,
      act: () => patch('books', reading.id, { current_page: (+reading.current_page || 0) + 10 }, '+5 XP')
    });
  }

  const posted = d.mindpick.some(m => m.post_date === t);
  out.push({
    emo: '📱', xp: XP.post,
    title: '마인드픽 1개 올리기',
    sub: posted ? '오늘 올림' : '릴스든 카드뉴스든 하나',
    done: posted,
    act: () => goTab('mindpick')
  });

  const due = dueCards(d);
  if (due.length) {
    out.push({
      emo: '🧠', xp: XP.review * due.length,
      title: `숙달 복습 ${due.length}장`,
      sub: due.slice(0, 3).map(m => m.term).join(', '),
      done: false,
      act: () => goTab('mastery')
    });
  }

  const checked = d.selfcheck.some(s => s.date === t);
  out.push({
    emo: '🪞', xp: XP.check,
    title: '오늘 하루 메타인지 1개',
    sub: checked ? '오늘 점검함' : '선임 눈에 나는 몇 점이었나 · 근거와 함께',
    done: checked,
    act: () => goTab('selfcheck')
  });

  /* 적용 안 한 노트가 있으면 새 노트보다 그걸 먼저 민다. */
  const pending = d.notes.find(n => !n.applied && n.action);
  if (pending) {
    out.push({
      emo: '✅', xp: XP.applied,
      title: '노트 하나 실제로 적용하기',
      sub: pending.action.slice(0, 40),
      done: false,
      act: () => patch('notes', pending.id, { applied: true, updated_at: new Date().toISOString() }, `+${XP.applied} XP`)
    });
  } else {
    const noted = d.notes.some(n => (n.created_at || '').slice(0, 10) === t);
    out.push({
      emo: '📝', xp: XP.note,
      title: '오늘 배운 것 노트 1개',
      sub: noted ? '오늘 남김' : '책·강의·경험 아무거나',
      done: noted,
      act: () => goTab('notes')
    });
  }

  const stuck = d.blockers.filter(b => b.status !== 'solved')[0];
  if (stuck) {
    out.push({
      emo: '🧩', xp: XP.solved,
      title: '막힌 것 하나 풀기',
      sub: stuck.title.slice(0, 40),
      done: false,
      act: () => goTab('blockers')
    });
  }

  const staleP = d.people.find(p => p.keep && (!p.last_contact || p.last_contact < daysAgo(30)));
  if (staleP) {
    out.push({
      emo: '🤝', xp: XP.person,
      title: `${staleP.name} 에게 먼저 연락`,
      sub: staleP.next_action || '오래 연락 안 함',
      done: false,
      act: () => patch('people', staleP.id, { last_contact: t }, '기록했어')
    });
  }

  const task = d.military
    .filter(x => x.status !== 'done')
    .sort((a, b) => (a.target_date || '9999').localeCompare(b.target_date || '9999'))[0];
  if (task) {
    out.push({
      emo: '🪖', xp: XP.task,
      title: task.task,
      sub: task.target_date ? `목표 ${task.target_date}` : '군대',
      done: false,
      act: () => patch('military', task.id, { status: 'done', completed_at: new Date().toISOString() }, `+${XP.task} XP`)
    });
  }

  return out;
}

function stats(d) {
  const doneL = d.courses.reduce((s, c) => s + (+c.completed_lectures || 0), 0);
  const totL  = d.courses.reduce((s, c) => s + (+c.total_lectures || 0), 0);
  const week  = d.fitness.filter(f => f.date >= daysAgo(6)).length;
  const reading = d.books.filter(b => b.status === 'reading');
  const readPct = reading.length
    ? Math.round(reading.reduce((s, b) => s + pct(+b.current_page || 0, +b.total_pages || 0), 0) / reading.length)
    : null;
  const month = d.mindpick.filter(m => m.post_date >= daysAgo(29)).length;
  const mDone = d.military.filter(x => x.status === 'done').length;

  const applied = d.notes.filter(n => n.applied).length;
  const solved  = d.blockers.filter(b => b.status === 'solved').length;
  const sv      = service(d);

  const mast = d.mastery.filter(m => (m.level || 0) >= 2).length;

  return [
    { emo: '🧠', label: '숙달',      pct: d.mastery.length ? pct(mast, d.mastery.length) : null, detail: d.mastery.length ? `구사 ${mast}/${d.mastery.length}` : '없음' },
    { emo: '📝', label: '노트 적용', pct: d.notes.length ? pct(applied, d.notes.length) : null, detail: d.notes.length ? `${applied}/${d.notes.length}` : '없음' },
    { emo: '🧩', label: '돌파',      pct: d.blockers.length ? pct(solved, d.blockers.length) : null, detail: d.blockers.length ? `${solved}/${d.blockers.length}` : '없음' },
    { emo: '🔥', label: '연속',      pct: pct(streakOf(d), 30),                 detail: `${streakOf(d)}일` },
    { emo: '📚', label: '강의',      pct: totL ? pct(doneL, totL) : null,       detail: totL ? `${doneL}/${totL}강` : '없음' },
    { emo: '💪', label: '운동',      pct: pct(week, 7),                         detail: `주 ${week}일` },
    { emo: '📖', label: '독서',      pct: readPct,                              detail: reading.length ? `${reading.length}권 읽는 중` : '없음' },
    { emo: '📱', label: '마인드픽',   pct: pct(month, 12),                       detail: `30일 ${month}개` },
    { emo: '🤝', label: '사람',      pct: d.people.length ? pct(d.people.filter(p => p.keep).length, d.people.length) : null, detail: d.people.length ? `${d.people.length}명` : '없음' },
    { emo: '🪖', label: '전역',      pct: sv ? sv.pct : null, detail: sv ? `D-${num(sv.left)}` : (d.military.length ? `${mDone}/${d.military.length}` : '없음') }
  ];
}

    const minus = el('button', 'mini', '−1');
    minus.onclick = () => patch('courses', r.id, { completed_lectures: Math.max(0, done - 1) });
    const plus = el('button', 'mini go', `+1강 (+${XP.lecture}XP)`);

      completed_lectures: tot ? Math.min(tot, done + 1) : done + 1,

function viewFitness(view, d) {
  const rows = d.fitness;

];

const dueCards = (d) => d.mastery.filter(m => !m.next_review || m.next_review <= today());

/* 복습 결과 반영. 맞으면 한 단계 올리고 간격을 늘린다. */
function gradeCard(card, ok, unaided) {
  const lv = ok ? Math.min(3, (card.level || 0) + 1) : Math.max(0, (card.level || 0) - 1);
  const next = new Date();
  next.setDate(next.getDate() + (ok ? LEVELS[lv].days : 1));
  return patch('mastery', card.id, {
    level: lv,
    reps: (card.reps || 0) + 1,
    lapses: (card.lapses || 0) + (ok ? 0 : 1),
    unaided_count: (card.unaided_count || 0) + (unaided ? 1 : 0),
    last_review: today(),
    next_review: iso(next)
  });
}

let reviewQueue = null;   // 복습 중인 카드 배열
let reviewShown = false;  // 답을 열었는가

function viewMastery(view, d) {
  const rows = d.mastery;
  const due = dueCards(d);

  /* 복습 모드 */
  if (reviewQueue && reviewQueue.length) {
    const card = rows.find(m => m.id === reviewQueue[0]) || null;
    if (!card) { reviewQueue.shift(); return viewMastery(view, d); }

    const c = el('div', 'card pop');
    const top = el('div', 'rowtop');
    top.append(el('span', 'n', `${MCAT_LABEL[card.category] || card.category} · ${LEVELS[card.level || 0].emo} ${LEVELS[card.level || 0].name}`),
               el('span', 'v', `남은 ${reviewQueue.length}장`));
    c.append(top);

    const q = el('div');
    q.style.cssText = 'font-size:1.35rem;font-weight:700;line-height:1.35;margin:18px 0 4px;letter-spacing:-.02em';
    q.textContent = card.term;
    c.append(q);

    if (!reviewShown) {
      if (card.cue) {
        const cue = el('div', null, '실마리 · ' + card.cue);
        cue.style.cssText = 'font-size:.8rem;color:var(--faint);margin-bottom:18px';
        c.append(cue);
      }
      const show = el('button', 'submit', '답 보기');
      show.onclick = () => { reviewShown = true; render(); };
      c.append(show);
    } else {
      const fld = (k, v, cls) => {
        if (!v) return;
        const f = el('div', 'field' + (cls ? ' ' + cls : ''));
        f.append(el('div', 'k', k), el('div', 'v', v));
        c.append(f);
      };
      fld('내용', card.meaning);
      fld('실마리', card.cue);
      fld('왜 중요한가', card.why, 'act');

      const hint = el('div', null, '안 보고 떠올랐으면 "무의식" 을 눌러. 그게 진짜 숙달이야.');
      hint.style.cssText = 'font-size:.76rem;color:var(--faint);margin:16px 0 8px';
      c.append(hint);

      const acts = el('div', 'acts');
      const no = el('button', 'mini danger', '못 떠올림');
      no.onclick = async () => { await gradeCard(card, false, false); reviewQueue.shift(); reviewShown = false; render(); };
      const yes = el('button', 'mini go', '떠올랐다');
      yes.onclick = async () => { await gradeCard(card, true, false); reviewQueue.shift(); reviewShown = false; render(); };
      const un = el('button', 'mini ok', `무의식 (+${XP.unaided}XP)`);
      un.onclick = async () => { await gradeCard(card, true, true); reviewQueue.shift(); reviewShown = false; render(); };
      acts.append(no, yes, un);
      c.append(acts);
    }

    const quit = el('button', 'mini', '복습 그만');
    quit.style.marginTop = '14px';
    quit.onclick = () => { reviewQueue = null; reviewShown = false; render(); };
    c.append(quit);

    view.append(c);
    return;
  }
  if (reviewQueue) { reviewQueue = null; toast('복습 끝!', 'good'); }

  /* 요약 */
  const head = card('숙달');
  const g = el('div', 'rings');
  const byLevel = n => rows.filter(m => (m.level || 0) === n).length;
  [1, 2, 3].forEach(n => {
    const cell = el('div', 'ringcell');
    const w = el('div', 'ringwrap');
    w.append(ring(rows.length ? pct(rows.filter(m => (m.level || 0) >= n).length, rows.length) : 0, 56, 6));
    w.append(el('div', 'pctxt', String(rows.filter(m => (m.level || 0) >= n).length)));
    cell.append(w, el('div', 'lab', `${LEVELS[n].emo} ${LEVELS[n].name}`), el('div', 'val', `이상 ${rows.filter(m => (m.level || 0) >= n).length}개`));
    g.append(cell);
  });
  head.append(g);
  const sum = el('div', 'empty', `전체 ${rows.length}개 · 오늘 복습할 것 ${due.length}개 · 아직 모르는 것 ${byLevel(0)}개`);
  head.append(sum);
  if (due.length) {
    const start = el('button', 'submit', `복습 시작 (${due.length}장)`);
    start.onclick = () => { reviewQueue = due.map(m => m.id); reviewShown = false; render(); };
    head.append(start);
  }
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 항목 추가', form(MASTERY_FIELDS, b => {
    b.category = b.category || 'knowledge';
    return save('mastery', b, `+${XP.card} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty',
      '선임이 알려준 것을 그날 바로 넣어. 탄종 하나, 렌치 하나씩이면 된다. ' +
      '내용은 네가 직접 써야 머리에 남는다 — 받아적은 걸 그대로 옮기지 말고 네 말로 바꿔서.'));
    view.append(e);
    return;
  }

  MASTERY_CATS.forEach(([cat, label]) => {
    const group = rows.filter(m => m.category === cat);
    if (!group.length) return;
    const c = card(`${label} ${group.length}`);
    group.sort((a, b) => (a.level || 0) - (b.level || 0)).forEach(m => {
      const e = el('div', 'entry');
      const h = el('div', 'eh');
      h.append(el('div', 'et', m.term));
      h.append(el('span', 'pill' + ((m.level || 0) >= 3 ? ' solved' : (m.level || 0) >= 2 ? ' trying' : ''),
        `${LEVELS[m.level || 0].emo} ${LEVELS[m.level || 0].name}`));
      e.append(h);
      const meta = [
        m.next_review ? (m.next_review <= today() ? '오늘 복습' : `다음 ${m.next_review}`) : '복습 예정 없음',
        `${m.reps || 0}회`,
        (m.unaided_count || 0) ? `무의식 ${m.unaided_count}회` : null
      ].filter(Boolean).join(' · ');
      e.append(el('div', 'src', meta));
      if (m.meaning) {
        const x = el('div', 'field');
        x.append(el('div', 'k', '내용'), el('div', 'v', m.meaning));
        e.append(x);
      }
      if (m.why) {
        const x = el('div', 'field act');
        x.append(el('div', 'k', '왜 중요한가'), el('div', 'v', m.why));
        e.append(x);
      }
      const acts = el('div', 'acts');
      const del = el('button', 'mini danger', '삭제');
      del.onclick = () => remove('mastery', m.id, m.term);
      acts.append(editBtn('항목 수정', MASTERY_FIELDS, m, 'mastery'), del);
      e.append(acts);
      c.append(e);
    });
    view.append(c);
  });
}

function viewSelfcheck(view, d) {
  const rows = d.selfcheck;

  const head = card('메타인지');
  head.append(el('div', 'empty',
    '내 눈의 나와 선임 눈의 나는 다르다. 바꿀 수 있는 건 남이 아니라 그 차이다. ' +
    '점수보다 근거 칸이 중요하다 — 느낌 말고 실제로 있었던 일만 적는다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 점검 기록', form(CHECK_FIELDS.map(x => x.key === 'date' ? { ...x, value: today() } : x), b => {
    b.area = b.area || AREAS[0];
    b.date = b.date || today();
    return save('selfcheck', b, `+${XP.check} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  /* 영역별 평균 간극 */
  const gapCard = card('영역별 간극');
  AREAS.forEach(area => {
    const g = rows.filter(r => r.area === area && r.self_score != null && r.other_score != null);
    if (!g.length) return;
    const self = g.reduce((s, r) => s + r.self_score, 0) / g.length;
    const other = g.reduce((s, r) => s + r.other_score, 0) / g.length;
    const diff = (self - other).toFixed(1);
    const row = el('div', 'row');
    const top = el('div', 'rowtop');
    top.append(el('span', 'n', area),
               el('span', 'v', `나 ${self.toFixed(1)} · 선임 ${other.toFixed(1)} · 차 ${diff > 0 ? '+' : ''}${diff}`));
    const track = el('div', 'track');
    const fl = el('div', 'fill');
    fl.style.width = pct(other, 5) + '%';
    if (Math.abs(diff) <= 0.5) fl.classList.add('full');
    track.append(fl);
    row.append(top, track);
    gapCard.append(row);
  });
  gapCard.append(el('div', 'empty', '막대는 선임이 볼 점수. 차이가 0.5 이내면 초록.'));
  view.append(gapCard);

  const listCard = card('기록');
  rows.forEach(r => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', r.area));
    if (r.self_score != null && r.other_score != null) {
      const diff = r.self_score - r.other_score;
      h.append(el('span', 'pill' + (Math.abs(diff) <= 1 ? ' solved' : ' open'),
        `나 ${r.self_score} / 선임 ${r.other_score}`));
    }
    e.append(h);
    e.append(el('div', 'src', r.date));
    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('근거', r.evidence);
    fld('왜 차이 나나', r.gap_note);
    fld('바꿀 것', r.action, 'act');
    const acts = el('div', 'acts');
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('selfcheck', r.id, r.area + ' ' + r.date);
    acts.append(editBtn('점검 수정', CHECK_FIELDS, r, 'selfcheck'), del);
    e.append(acts);
    listCard.append(e);
  });

function viewNotes(view, d) {
  const rows = d.notes;
  const applied = rows.filter(n => n.applied).length;

  const head = card('노트');
  const g = el('div', 'rings');
  const tile = (emo, v, label) => {
    const c = el('div', 'ringcell');
    const n = el('div', null, v);
    n.style.cssText = 'font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums';
    c.append(el('div', null, emo), n, el('div', 'lab', label));
    return c;
  };
  g.append(tile('📝', String(rows.length), '전체'), tile('✅', String(applied), '적용함'), tile('⏳', String(rows.length - applied), '아직'));
  head.append(g);
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 노트 추가', form(NOTE_FIELDS(), b => {
    b.source_type = b.source_type || 'book';
    return save('notes', b, `+${XP.note} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty', '책이나 강의에서 건진 것 하나만 적어봐. 나중에 여기서 다시 찾아 읽고, 적용했는지 체크할 수 있어.'));
    view.append(e);
    return;
  }

  const notApplied = rows.filter(n => !n.applied);
  if (notApplied.length) {
    const c = card(`아직 적용 안 한 것 ${notApplied.length}개`);
    notApplied.forEach(n => c.append(noteCard(n)));
    view.append(c);
  }
  const done = rows.filter(n => n.applied);
  if (done.length) {
    const c = card(`적용한 것 ${done.length}개`);
    done.forEach(n => c.append(noteCard(n)));
    view.append(c);
  }
}

/* ---------- 🧩 막힌 것 ---------- */

const BLOCKER_FIELDS = [
  { key: 'title', required: true, label: '무엇이 막혔나', placeholder: '예) 릴스를 찍긴 하는데 끝까지 안 봄' },
  { key: 'category', label: '분류', type: 'select', options: BLOCKER_CATS, half: true },
  { key: 'source', label: '어디서 나왔나', placeholder: '예) 힉스필드 강의', half: true },
  { key: 'detail', label: '구체적으로 어떤 상황인지', type: 'textarea' },
  { key: 'attempts', label: '시도해본 것', type: 'textarea' },
  { key: 'solution', label: '찾은 해결점', type: 'textarea' }
];

let blockerFilter = 'all';

function viewBlockers(view, d) {
  const rows = d.blockers;
  const solved = rows.filter(b => b.status === 'solved');

  const head = card('막힌 것 → 해결');
  bar(head, '돌파율', solved.length, rows.length, `${solved.length} / ${rows.length}개`);
  head.append(el('div', 'empty', '실행이 막히는 지점을 적어두고, 해결점을 찾으면 채운다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 막힌 것 추가', form(BLOCKER_FIELDS, b => {
    b.category = b.category || 'execution';
    b.status = b.solution ? 'solved' : 'open';
    if (b.solution) b.solved_at = new Date().toISOString();
    return save('blockers', b, b.solution ? `+${XP.solved} XP` : '기록했어');
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  const listCard = card();
  const seg = el('div', 'seg');
  [['all', '전체'], ...BLOCKER_CATS].forEach(([v, t]) => {
    const b = el('button', blockerFilter === v ? 'on' : '', t);
    b.onclick = () => { blockerFilter = v; render(); };
    seg.append(b);
  });
  listCard.append(seg);

  const shown = rows.filter(b => blockerFilter === 'all' || b.category === blockerFilter);
  const order = { open: 0, trying: 1, solved: 2 };
  shown.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));

  if (!shown.length) listCard.append(el('div', 'empty', '이 분류엔 없어'));

  shown.forEach(b => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', b.title));
    h.append(el('span', 'pill ' + b.status, b.status === 'solved' ? '해결' : b.status === 'trying' ? '시도 중' : '막힘'));
    e.append(h);

    const src = [CAT_LABEL[b.category] || b.category, b.source].filter(Boolean).join(' · ');
    if (src) e.append(el('div', 'src', src));

    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('상황', b.detail);
    fld('시도한 것', b.attempts);
    fld('해결점', b.solution, 'sol');

    const acts = el('div', 'acts');
    if (b.status !== 'solved') {
      if (b.status === 'open') {
        const t = el('button', 'mini', '시도 중으로');
        t.onclick = () => patch('blockers', b.id, { status: 'trying' });
        acts.append(t);
      }
      const s = el('button', 'mini ok', `해결됨 (+${XP.solved}XP)`);
      s.onclick = () => {
        const v = prompt('어떻게 풀었어? (해결점)', b.solution || '');
        if (v === null) return;
        patch('blockers', b.id, { status: 'solved', solution: v, solved_at: new Date().toISOString() }, `+${XP.solved} XP`);
      };
      acts.append(s);
    } else {
      const u = el('button', 'mini', '다시 열기');
      u.onclick = () => patch('blockers', b.id, { status: 'open', solved_at: '' });
      acts.append(u);
    }
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('blockers', b.id, b.title);
    acts.append(editBtn('막힌 것 수정', BLOCKER_FIELDS, b, 'blockers'), del);
    e.append(acts);
    listCard.append(e);
  });
  view.append(listCard);
}

/* ---------- 🤝 사람 ---------- */

const PEOPLE_FIELDS = [
  { key: 'name', required: true, label: '이름 / 닉네임' },
  { key: 'met_where', label: '어디서', placeholder: '예) 스레드 DM, 독서모임', half: true },
  { key: 'met_at', label: '처음 만난 날', type: 'date', half: true },
  { key: 'tags', label: '태그', placeholder: '예) 마케팅, 영상, 글쓰기' },
  { key: 'learned', label: '이 사람에게서 배운 것', type: 'textarea' },
  { key: 'next_action', label: '다음에 할 것', placeholder: '예) 만든 릴스 보여주고 피드백 받기' },
  { key: 'last_contact', label: '마지막 연락', type: 'date' }
];

function viewPeople(view, d) {
  const rows = d.people;
  const stale = rows.filter(p => p.keep && (!p.last_contact || p.last_contact < daysAgo(30)));

  const head = card('사람');
  const g = el('div', 'rings');
  const tile = (emo, v, label) => {
    const c = el('div', 'ringcell');
    const n = el('div', null, v);
    n.style.cssText = 'font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums';
    c.append(el('div', null, emo), n, el('div', 'lab', label));
    return c;
  };
  g.append(
    tile('🤝', String(rows.length), '전체'),
    tile('⭐', String(rows.filter(p => p.keep).length), '이어갈 사람'),
    tile('📮', String(stale.length), '연락한 지 오래')
  );
  head.append(g);
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 사람 추가', form(PEOPLE_FIELDS, b => save('people', b, `+${XP.person} XP`)), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty',
      '오프라인에서 만나기 어려운 상황이면 온라인 접점을 세는 게 낫다. 스레드에서 답글 준 사람, 댓글 단 사람, 도움 받은 사람부터 하나씩.'));
    view.append(e);
    return;
  }

  if (stale.length) {
    const c = card(`먼저 연락해볼 사람 ${stale.length}명`);
    stale.forEach(p => {
      const it = el('div', 'item');
      const g2 = el('div', 'grow');
      g2.append(el('div', 't', p.name));
      g2.append(el('div', 'm', p.next_action || (p.last_contact ? `마지막 연락 ${p.last_contact}` : '연락 기록 없음')));
      it.append(g2);
      const ok = el('button', 'mini go', '연락함');
      ok.onclick = () => patch('people', p.id, { last_contact: today() }, '기록했어');
      it.append(ok);
      c.append(it);
    });
    view.append(c);
  }

  const listCard = card('전체');
  rows.forEach(p => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', p.name));
    if (p.keep) h.append(el('span', 'pill applied', '이어감'));
    e.append(h);
    const src = [p.met_where, p.met_at, p.tags].filter(Boolean).join(' · ');
    if (src) e.append(el('div', 'src', src));
    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('배운 것', p.learned);
    fld('다음에 할 것', p.next_action, 'act');

    const acts = el('div', 'acts');
    const ct = el('button', 'mini', '오늘 연락함');
    ct.onclick = () => patch('people', p.id, { last_contact: today() }, '기록했어');
    const kp = el('button', 'mini', p.keep ? '이어가기 해제' : '이어갈 사람');
    kp.onclick = () => patch('people', p.id, { keep: !p.keep });
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('people', p.id, p.name);
    acts.append(ct, kp, editBtn('사람 수정', PEOPLE_FIELDS, p, 'people'), del);
    e.append(acts);
    listCard.append(e);
  });
  view.append(listCard);
}

/* ---------- 💡 아이디어 ---------- */

const IDEA_FIELDS = [
  { key: 'title', required: true, label: '아이디어' },
  { key: 'category', label: '분류', placeholder: '예) 콘텐츠 / 제품 / 사업', half: true },
  { key: 'status', label: '상태', type: 'select', options: IDEA_STATUS, half: true },
  { key: 'detail', label: '설명 — 누구의 어떤 문제를 푸는가', type: 'textarea' }
];

function viewIdeas(view, d) {
  const rows = d.ideas;

  const head = card('아이디어함');
  head.append(el('div', 'empty', '떠오른 걸 흘려보내지 않는 곳. 씨앗 → 만드는 중 → 내보냄 으로 옮긴다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 아이디어 추가', form(IDEA_FIELDS, b => {
    b.status = b.status || 'seed';
    return save('ideas', b, `+${XP.idea} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  IDEA_STATUS.forEach(([st, label]) => {
    const group = rows.filter(i => i.status === st);
    if (!group.length) return;
    const c = card(`${label} ${group.length}`);
    group.forEach(i => {
      const e = el('div', 'entry');
      const h = el('div', 'eh');
      h.append(el('div', 'et', i.title));
      h.append(el('span', 'pill' + (st === 'shipped' ? ' solved' : st === 'building' ? ' trying' : ''), label));
      e.append(h);
      if (i.category) e.append(el('div', 'src', i.category));
      if (i.detail) {
        const x = el('div', 'field');
        x.append(el('div', 'k', '설명'), el('div', 'v', i.detail));
        e.append(x);
      }
      const acts = el('div', 'acts');
      if (st === 'seed') {
        const b1 = el('button', 'mini go', '만들기 시작');
        b1.onclick = () => patch('ideas', i.id, { status: 'building' });
        acts.append(b1);
      }
      if (st === 'building') {
        const b2 = el('button', 'mini ok', `내보냄 (+${XP.shipped}XP)`);
        b2.onclick = () => patch('ideas', i.id, { status: 'shipped' }, `+${XP.shipped} XP`);
        acts.append(b2);
      }
      if (st !== 'dropped' && st !== 'shipped') {
        const b3 = el('button', 'mini', '접기');
        b3.onclick = () => patch('ideas', i.id, { status: 'dropped' });
        acts.append(b3);
      }
      const del = el('button', 'mini danger', '삭제');
      del.onclick = () => remove('ideas', i.id, i.title);
      acts.append(editBtn('아이디어 수정', IDEA_FIELDS, i, 'ideas'), del);
      e.append(acts);
      c.append(e);
    });
    view.append(c);
  });
}

const VIEWS = {
  home: viewHome, mastery: viewMastery, selfcheck: viewSelfcheck,
  notes: viewNotes, blockers: viewBlockers, people: viewPeople, ideas: viewIdeas,
  courses: viewCourses, fitness: viewFitness, books: viewBooks, mindpick: viewMindpick, military: viewMilitary
};

/* ============ 부팅 ============ */

async function render() {
  const view = document.getElementById('view');
  if (!view.childElementCount) {
    const l = card();
    l.append(el('div', 'empty', '불러오는 중…'));
    view.append(l);
  }
  try {
    const d = await loadAll();
    const st = streakOf(d);
    const chip = document.getElementById('streakchip');
    chip.textContent = `🔥 ${st}일`;
    chip.classList.toggle('hot', st >= 3);
    const fresh = document.createElement('div');
    VIEWS[current](fresh, d);
    [...fresh.children].forEach((n, i) => n.style.setProperty('--i', i));
    view.replaceChildren(...fresh.childNodes);
  } catch (err) {
    const c = card('연결 실패');
    c.append(el('div', 'err', err.message));
    const retry = el('button', 'submit', '다시 시도');
    retry.onclick = () => { DATA = null; render(); };
    c.append(retry);
    view.replaceChildren(c);
  }
}

(function boot() {
  const nav = document.getElementById('tabs');
  TABS.forEach(t => {
    const b = el('button', t.id === current ? 'on' : '', t.label);
    b.onclick = () => goTab(t.id);
    nav.append(b);
  });
  render();
})();
</script>
