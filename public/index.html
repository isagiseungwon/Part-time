<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>강승원 · 성장 기록</title>
<style>
  /* 색상은 dataviz 검증기 통과값. 파랑=진행, 주황=연속기록, 청록=완료.
     세 색은 all-pairs 색맹 분리 ΔE 9.4 / 일반 20.9 로 통과한다. */
  :root {
    color-scheme: dark;
    /* 완전한 검정은 눈이 피로하다. 살짝 띄운 남색 계열로. */
    --page:      #0f1017;
    --card:      #191b25;
    --raised:    #21242f;
    --line:      #2c3040;
    --track:     #363b4d;  /* 진행 트랙. 카드 위에서 확실히 보여야 링이 링으로 읽힌다 */
    --text:      #edeff5;
    --muted:     #a2a7b8;
    --faint:     #737a8c;

    --accent:    #3987e5;  /* 진행 */
    --streak:    #d95926;  /* 연속 */
    --done:      #199e70;  /* 완료 */
    --urgent:    #d03b3b;  /* 마감 임박 */

    --heat-0:    #1c1c25;
    --heat-1:    #1c5cab;
    --heat-2:    #256abf;
    --heat-3:    #3987e5;
    --heat-4:    #86b6ef;

    --r:         20px;
    /* 입체감은 그림자 한 겹으로 안 난다. 안쪽 하이라이트 + 바깥 그림자 두 겹. */
    --lift:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 1px 2px rgba(0,0,0,.5),
      0 14px 34px -20px rgba(0,0,0,1);
    --lift-hi:
      0 1px 0 rgba(255,255,255,.10) inset,
      0 2px 6px rgba(0,0,0,.55),
      0 22px 48px -22px rgba(0,0,0,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.62;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }

  /* 화면 위쪽에 은은한 빛. 고정이라 스크롤해도 배경에 남는다.
     transform 만 움직여서 GPU 에 맡긴다 — 그라데이션 자체를 다시 그리면 폰이 버벅인다. */
  body::before, body::after {
    content: '';
    position: fixed; inset: -25%; z-index: -1; pointer-events: none;
    will-change: transform;
  }
  body::before {
    background:
      radial-gradient(700px 440px at 22% 14%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
      radial-gradient(560px 400px at 78% 26%, color-mix(in srgb, var(--done) 12%, transparent), transparent 68%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  body::after {
    background:
      radial-gradient(620px 420px at 82% 8%, color-mix(in srgb, var(--streak) 16%, transparent), transparent 68%),
      radial-gradient(520px 380px at 12% 40%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%);
    animation: drift2 34s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate3d(-3%, -2%, 0) scale(1);    }
    to   { transform: translate3d(4%, 3%, 0)   scale(1.12); }
  }
  @keyframes drift2 {
    from { transform: translate3d(3%, 2%, 0)   scale(1.08); }
    to   { transform: translate3d(-4%, -3%, 0) scale(1);    }
  }

  /* 카드가 아래에서 살짝 올라오며 나타난다. --i 로 순서를 준다. */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  main > * {
    animation: riseIn .42s cubic-bezier(.2,.8,.3,1) both;
    animation-delay: calc(var(--i, 0) * 45ms);
  }

  /* ---------- 모션 ---------- */

  /* 액션할 때마다 화면에 뜨는 +N XP */
  .xppop {
    position: fixed; left: 50%; top: 42%; z-index: 80;
    transform: translate(-50%, -50%);
    font-size: 2.6rem; font-weight: 850; letter-spacing: -.03em;
    color: var(--accent);
    text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 85%, transparent);
    pointer-events: none;
    animation: xpFloat 1.15s cubic-bezier(.2,.9,.3,1) forwards;
  }
  .xppop.big { color: var(--done); text-shadow: 0 0 30px color-mix(in srgb, var(--done) 85%, transparent); }
  @keyframes xpFloat {
    0%   { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
    22%  { opacity: 1; transform: translate(-50%, -55%) scale(1.16); }
    38%  { transform: translate(-50%, -52%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -135%) scale(.94); }
  }

  /* 레벨업 배너 */
  .levelup {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .levelup .plate {
    text-align: center; padding: 26px 34px; border-radius: 24px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow: 0 0 60px -10px color-mix(in srgb, var(--accent) 70%, transparent), var(--lift-hi);
    animation: plateIn .5s cubic-bezier(.2,1.4,.35,1) both, plateOut .45s ease-in 2.1s both;
  }
  .levelup .lu { font-size: .78rem; font-weight: 750; letter-spacing: .22em; color: var(--accent); }
  .levelup .lv { font-size: 3.4rem; font-weight: 850; line-height: 1.05; letter-spacing: -.04em; margin: 4px 0 2px; }
  .levelup .tn { font-size: .95rem; font-weight: 700; color: var(--muted); }
  @keyframes plateIn  { from { opacity: 0; transform: scale(.7) translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes plateOut { to   { opacity: 0; transform: scale(1.06); } }

  /* 종잇조각. 각 조각의 좌표·회전은 인라인 변수로 준다. */
  .conf {
    position: fixed; top: 42%; left: 50%; z-index: 88;
    width: 9px; height: 14px; border-radius: 2px;
    pointer-events: none; will-change: transform, opacity;
    animation: confFly var(--d, 1.5s) cubic-bezier(.15,.6,.4,1) forwards;
  }
  @keyframes confFly {
    0%   { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(.4); }
    12%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1); }
  }

  /* 체크박스가 눌릴 때 톡 튀는 느낌 */
  .chk.on { animation: chkPop .34s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes chkPop {
    0%   { transform: scale(.75); }
    55%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* 퀘스트를 눌렀을 때 한 번 번쩍 */
  .quest.firing {
    animation: fire .42s ease-out both;
    border-color: color-mix(in srgb, var(--done) 70%, transparent);
  }
  @keyframes fire {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 55%, transparent); }
    35%  { transform: scale(.975); box-shadow: 0 0 0 10px color-mix(in srgb, var(--done) 0%, transparent); }
    100% { transform: scale(1); }
  }

  /* 화면 전환 */
  main.swap > * { animation: riseIn .34s cubic-bezier(.2,.8,.3,1) both; }

  /* 불러오는 동안 뼈대 */
  .skel { border-radius: 12px; background: var(--raised); position: relative; overflow: hidden; }
  .skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, #fff 7%, transparent) 50%, transparent 80%);
    transform: translateX(-100%);
    animation: sweep 1.25s ease-in-out infinite;
  }

  /* ---------- 헤더 ---------- */

  header {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .bar h1 {
    margin: 0; font-size: 1rem; font-weight: 750; letter-spacing: -.02em;
    background: linear-gradient(92deg, #fff 10%, #9ec5f4 60%, #86b6ef);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .bar .spacer { flex: 1; }

  .streakchip {
    display: flex; align-items: center; gap: 5px;
    background: color-mix(in srgb, var(--streak) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--streak) 45%, transparent);
    color: var(--streak);
    border-radius: 999px; padding: 5px 12px;
    font-size: .78rem; font-weight: 750;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 16px -4px color-mix(in srgb, var(--streak) 60%, transparent);
  }
  .streakchip.hot { animation: emberPulse 2.4s ease-in-out infinite; }
  @keyframes emberPulse {
    0%, 100% { box-shadow: 0 0 14px -5px color-mix(in srgb, var(--streak) 55%, transparent); }
    50%      { box-shadow: 0 0 22px -2px color-mix(in srgb, var(--streak) 85%, transparent); }
  }

  /* ---------- 아래 탭바 ---------- */

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 2px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--card) 78%, transparent);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border-top: 1px solid var(--line);
    box-shadow: 0 -12px 34px -22px #000;
  }
  .tabbar button {
    position: relative; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: 0; padding: 8px 2px 6px; border-radius: 14px;
    color: var(--faint); font-size: .66rem; font-weight: 600;
    transition: color .18s, transform .18s;
  }
  .tabbar button .ti { font-size: 1.22rem; line-height: 1; transition: transform .22s cubic-bezier(.2,1.5,.4,1); }
  .tabbar button.on { color: var(--accent); }
  .tabbar button.on .ti { transform: translateY(-2px) scale(1.14); }
  .tabbar button.on::before {
    content: '';
    position: absolute; inset: 2px 6px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent) inset;
  }
  .tabbar button > * { position: relative; }
  .tabbar button:active { transform: scale(.94); }

  /* 어디서든 닿는 기록 버튼. 기록 한 번에 탭 이동 + 폼 열기를 요구하면 안 쓴다. */
  .fab {
    position: fixed; right: 16px; z-index: 46;
    bottom: calc(84px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 20px; border: 0; cursor: pointer;
    font-size: 1.8rem; font-weight: 300; line-height: 1; color: #fff; font-family: inherit;
    background: linear-gradient(150deg, #4f97f0, var(--accent) 55%, #2a6fc4);
    box-shadow:
      0 1px 0 rgba(255,255,255,.28) inset,
      0 10px 26px -8px color-mix(in srgb, var(--accent) 85%, transparent),
      0 18px 40px -22px #000;
    transition: transform .16s cubic-bezier(.2,1.5,.4,1);
  }
  .fab:active { transform: scale(.9) rotate(45deg); }

  .quickgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 6px; }
  .quickitem {
    display: flex; align-items: center; gap: 11px; cursor: pointer; font-family: inherit;
    padding: 16px 14px; border-radius: 16px; text-align: left;
    background: var(--raised); border: 1px solid var(--line);
    color: var(--text); font-size: .88rem; font-weight: 650;
    box-shadow: var(--lift);
    transition: transform .16s;
  }
  .quickitem .qe { font-size: 1.4rem; line-height: 1; flex: 0 0 auto; }
  .quickitem .qs { display: block; font-size: .7rem; font-weight: 500; color: var(--faint); margin-top: 1px; }
  .quickitem:active { transform: scale(.96); }

  /* ---------- 실행 의도 ---------- */

  .cue {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
    font-size: .74rem; font-weight: 600;
    color: var(--done);
    background: color-mix(in srgb, var(--done) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--done) 32%, transparent);
    border-radius: 8px; padding: 4px 9px;
  }

  /* 더보기 안의 아이콘 격자 */
  .moregrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
  .moreitem {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 16px 8px; border-radius: 16px; cursor: pointer; font-family: inherit;
    background: var(--raised); border: 1px solid var(--line);
    color: var(--text); font-size: .76rem; font-weight: 600;
    box-shadow: var(--lift);
    transition: transform .16s;
  }
  .moreitem .me { font-size: 1.5rem; line-height: 1; }
  .moreitem:active { transform: scale(.95); }
  .moreitem.on { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); }

  main { padding: 18px 16px; display: grid; gap: 14px; }

  /* ---------- 카드 ---------- */

  .card {
    position: relative;
    background:
      linear-gradient(168deg, color-mix(in srgb, #fff 4%, transparent), transparent 46%),
      var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 20px 18px;
    box-shadow: var(--lift);
  }
  /* 카드 윗변에 가느다란 빛줄기 */
  .card::before {
    content: '';
    position: absolute; left: 14%; right: 14%; top: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 55%, transparent), transparent);
    opacity: .55;
  }
  .card > h2 {
    margin: 0 0 14px; font-size: .8rem; font-weight: 650;
    color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
  }

  /* ---------- 레벨 히어로 ---------- */

  /* 레벨 카드는 더 세게 — 여기가 첫인상이다 */
  .herocard {
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 58%),
      radial-gradient(120% 140% at 100% 100%, color-mix(in srgb, var(--streak) 13%, transparent), transparent 58%),
      var(--card);
    border-color: color-mix(in srgb, var(--accent) 26%, var(--line));
    overflow: hidden;
  }
  .herocard::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 70% at 18% 20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }
  .herocard > * { position: relative; z-index: 1; }

  .hero { display: flex; align-items: center; gap: 16px; }
  .lvlring { position: relative; flex: 0 0 auto; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 40%, transparent)); }

  .tier {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .7rem; font-weight: 750; letter-spacing: .06em;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 6px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .lvlring .num {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .lvlring .num b { font-size: 1.7rem; font-weight: 700; letter-spacing: -.03em; }
  .lvlring .num span { font-size: .58rem; color: var(--faint); margin-top: 3px; letter-spacing: .1em; }

  .herobody { flex: 1; min-width: 0; }
  .herobody .xp { font-size: .95rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .herobody .next { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .xptrack {
    height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4) inset;
  }
  .xpfill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--accent), #6fb2ff 65%, #9ad0ff);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: width .8s cubic-bezier(.2,.8,.3,1);
    position: relative; overflow: hidden;
  }
  /* 게이지 위를 훑고 지나가는 빛 */
  .xpfill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.5) 50%, transparent 80%);
    transform: translateX(-100%);
    animation: sweep 2.6s ease-in-out 0.6s infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-100%) } 55%, 100% { transform: translateX(220%) } }

  /* ---------- 퀘스트 ---------- */

  .quest {
    display: flex; align-items: center; gap: 13px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 15px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 18px -16px #000;
    transition: transform .12s, border-color .15s;
  }
  .quest:last-child { margin-bottom: 0; }
  .quest:active { transform: scale(.985); }
  .quest .ico { font-size: 1.15rem; flex: 0 0 auto; width: 24px; text-align: center; }
  .quest .qt { flex: 1; min-width: 0; }
  .quest .qt .t { font-size: .88rem; font-weight: 550; }
  .quest .qt .s { font-size: .74rem; color: var(--faint); margin-top: 1px; }
  .quest .xpbadge {
    flex: 0 0 auto; font-size: .72rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .quest.cleared { border-color: color-mix(in srgb, var(--done) 45%, transparent); cursor: default; }
  .quest.cleared .qt .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .quest.cleared .xpbadge { color: var(--done); }

  /* ---------- 스탯 링 ---------- */

  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ringcell {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: var(--raised); border-radius: 12px; padding: 13px 6px 11px;
  }
  .ringcell .lab { font-size: .72rem; color: var(--muted); text-align: center; line-height: 1.25; }
  .ringcell .val { font-size: .68rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ringwrap { position: relative; }
  .ringwrap .pctxt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .ringwrap .emo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

  /* ---------- 히트맵 ---------- */

  .heat {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(7, 1fr); grid-auto-columns: 1fr;
    gap: 3px;
  }
  .heat i {
    width: auto; aspect-ratio: 1; border-radius: 3px;
    background: var(--heat-0); display: block;
    transition: transform .18s;
  }
  /* 활동이 많은 칸은 살짝 빛난다 */
  .heat i.lit { box-shadow: 0 0 8px -1px color-mix(in srgb, var(--accent) 65%, transparent); }
  .heat i.today { outline: 1.5px solid var(--streak); outline-offset: 1px; }
  .heatlegend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 10px; font-size: .68rem; color: var(--faint); }
  .heatlegend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

  /* ---------- 업적 ---------- */

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .badge {
    position: relative; overflow: hidden;
    background: var(--raised); border-radius: 12px; padding: 12px 8px;
    text-align: center; opacity: .3; filter: grayscale(1);
    transition: opacity .2s, filter .2s, transform .2s;
  }
  .badge.got {
    opacity: 1; filter: none;
    border: 1px solid color-mix(in srgb, var(--done) 40%, transparent);
    background:
      radial-gradient(90% 90% at 50% 0%, color-mix(in srgb, var(--done) 18%, transparent), transparent 70%),
      var(--raised);
    box-shadow: 0 0 18px -6px color-mix(in srgb, var(--done) 55%, transparent);
  }
  .badge.got .e { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--done) 60%, transparent)); }
  /* 획득한 배지에만 훑고 지나가는 반짝임 */
  .badge.got::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
    transform: translateX(-160%);

  .chk {

  .pill {
    display: inline-flex; align-items: center; gap: 4px;

  .pill.open   { color: var(--streak); border-color: color-mix(in srgb, var(--streak) 45%, transparent); }

  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    flex: 0 0 auto; cursor: pointer; font-family: inherit;

    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font-size: .76rem;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  #toast {
    /* 탭바 위로 띄운다 */
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));

  #toast.good { border-color: var(--done); color: var(--done); }

  @keyframes pop { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .pop { animation: pop .28s cubic-bezier(.2,.9,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }

</style>

const PRIMARY = ['home', 'goals', 'mastery', 'notes'];

const XP = {
  lecture: 10, workout: 20, page: 0.5, post: 30, task: 25, book: 60,

  card: 5, review: 3, unaided: 20, check: 20,

const LEVELS = [

const AREAS = ['포반 지식', '체력', '태도', '관계', '기타'];

const ACHIEVEMENTS = [
  { id: 'first',    emo: '🌱', name: '첫 기록',      test: d => total(d) > 0 },
  { id: 'week',     emo: '🔥', name: '7일 연속',     test: d => streakOf(d) >= 7 },

  { id: 'solve1',   emo: '🧩', name: '첫 돌파',      test: d => d.blockers.some(b => b.status === 'solved') },
  { id: 'solve5',   emo: '🔓', name: '5개 돌파',     test: d => d.blockers.filter(b => b.status === 'solved').length >= 5 },
  { id: 'people5',  emo: '🤝', name: '사람 5명',     test: d => d.people.length >= 5 },
  { id: 'ship1',    emo: '🚀', name: '아이디어 실현', test: d => d.ideas.some(i => i.status === 'shipped') },
  { id: 'post10',   emo: '📱', name: '게시물 10개',  test: d => d.mindpick.length >= 10 },
  { id: 'course1',  emo: '🎓', name: '강의 완주',    test: d => d.courses.some(c => +c.total_lectures > 0 && +c.completed_lectures >= +c.total_lectures) },
  { id: 'lvl5',     emo: '👑', name: '레벨 5',       test: d => levelOf(total(d)).level >= 5 },
  { id: 'lvl10',    emo: '🏆', name: '레벨 10',      test: d => levelOf(total(d)).level >= 10 },
  { id: 'card20',   emo: '🧠', name: '항목 20개',    test: d => d.mastery.length >= 20 },

/* 종잇조각 뿌리기. 조각마다 방향·거리·회전을 달리 준다. */
function confetti(count) {
  if (CALM) return;
  const colors = ['#3987e5', '#8fc7ff', '#199e70', '#3fd39a', '#d95926', '#f0c674'];
  for (let i = 0; i < (count || 46); i++) {
    const c = el('i', 'conf');
    const ang = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 230;
    c.style.setProperty('--x', `${Math.cos(ang) * dist}px`);
    c.style.setProperty('--y', `${Math.sin(ang) * dist + 140}px`);   // 아래로 살짝 떨어지게
    c.style.setProperty('--r', `${(Math.random() * 900 - 450).toFixed(0)}deg`);
    c.style.setProperty('--d', `${(1.1 + Math.random() * 0.9).toFixed(2)}s`);
    c.style.background = colors[i % colors.length];
    c.style.width = (6 + Math.random() * 6).toFixed(0) + 'px';
    document.body.append(c);
    setTimeout(() => c.remove(), 2200);
  }
}

function toast(msg, kind) {
  /* "+30 XP" 같은 메시지는 화면 가운데에도 크게 띄운다 */
  const m = String(msg).match(/\+\s?([\d,]+)\s?XP/);

/* ============ 경험치 · 레벨 ============ */

function total(d) {
  let xp = 0;
  for (const c of d.courses)   xp += (+c.completed_lectures || 0) * XP.lecture;
  for (const f of d.fitness)   xp += XP.workout;
  for (const b of d.books) {
    xp += Math.round((+b.current_page || 0) * XP.page);
    if (b.status === 'finished') xp += XP.book;
  }
  for (const m of d.mindpick)  xp += XP.post;
  for (const t of d.military)  if (t.status === 'done') xp += XP.task;
  for (const n of d.notes)     xp += XP.note + (n.applied ? XP.applied : 0);
  for (const b of d.blockers)  if (b.status === 'solved') xp += XP.solved;
  for (const p of d.people)    xp += XP.person;
  for (const i of d.ideas)     xp += XP.idea + (i.status === 'shipped' ? XP.shipped : 0);
  for (const m of d.mastery)   xp += XP.card + (m.reps || 0) * XP.review + (m.unaided_count || 0) * XP.unaided;
  for (const s of d.selfcheck) xp += XP.check;
  for (const s of d.steps)     if (s.done) xp += XP.step;
  for (const g of d.goals)     if (g.status === 'done') xp += XP.goalDone;
  for (const r of d.reviews)   xp += XP.review;
  for (const o of d.output)    xp += XP.output;
  for (const s of d.steal)     xp += XP.steal + (s.used ? XP.stealUsed : 0);
  return Math.round(xp);
}

/* 레벨 N → N+1 에 필요한 경험치: 100 + (N-1)*60 */
function levelOf(xp) {
  let level = 1, rest = xp, need = 100;
  while (rest >= need) { rest -= need; level++; need = 100 + (level - 1) * 60; }
  return { level, into: rest, need };
}

/* ============ 활동일 · 연속 기록 ============ */

function activityMap(d) {
  const m = new Map();
  const add = (v) => {
    if (!v) return;
    const day = String(v).slice(0, 10);
    m.set(day, (m.get(day) || 0) + 1);
  };
  d.fitness.forEach(r => add(r.date));
  d.mindpick.forEach(r => add(r.post_date));
  d.books.forEach(r => { add(r.finished_at); add(r.started_at); });
  d.military.forEach(r => add(r.completed_at));
  d.courses.forEach(r => add(r.created_at));
  d.notes.forEach(r => add(r.created_at));
  d.blockers.forEach(r => { add(r.created_at); add(r.solved_at); });
  d.people.forEach(r => { add(r.met_at); add(r.last_contact); });
  d.ideas.forEach(r => add(r.created_at));
  d.mastery.forEach(r => add(r.last_review));
  d.drills.forEach(r => add(r.date));
  d.selfcheck.forEach(r => add(r.date));
  d.steps.forEach(r => add(r.done_at));
  d.goals.forEach(r => add(r.updated_at));
  d.reviews.forEach(r => add(r.created_at));
  d.output.forEach(r => add(r.date));
  d.steal.forEach(r => add(r.created_at));
  return m;
}

/* 연속 기록. 7일마다 하루는 빠져도 이어진 것으로 친다.
   당직·훈련처럼 못 하는 날이 반드시 있는데, 하루 놓쳤다고 0이 되면
   대개 거기서 그만둔다. 완벽이 아니라 복귀 속도를 세는 쪽으로. */
function streakInfo(d) {
  const m = activityMap(d);
  if (!m.size) return { days: 0, frozen: 0, freezeLeft: 1, todayDone: false };

  const todayDone = m.has(today());
  let cur = new Date();
  if (!todayDone) cur.setDate(cur.getDate() - 1);   // 오늘은 아직 남았으니 어제부터

  let days = 0, frozen = 0, sinceFreeze = 99;
  for (;;) {
    if (m.has(iso(cur))) {
      days++; sinceFreeze++;
    } else if (sinceFreeze >= 7 && days > 0) {
      frozen++; sinceFreeze = 0;                     // 방탄 한 장 사용
    } else break;
    cur.setDate(cur.getDate() - 1);
  }
  return { days, frozen, freezeLeft: sinceFreeze >= 7 ? 1 : 0, todayDone };
}

const streakOf = (d) => streakInfo(d).days;

/* 목표 하나의 진행률과 페이스.
   "얼마나 왔나" 만으론 부족하다. 기한까지 남은 시간과 견줘서
   "하루에 얼마씩 해야 하나" 까지 나와야 오늘 할 일로 바뀐다. */
function goalStat(g) {
  const start = +g.start_value || 0;
  const cur = +g.current_value || 0;
  const tgt = +g.target_value || 0;
  const down = g.direction === 'down';

  const span = down ? (start - tgt) : (tgt - start);
  const gone = down ? (start - cur) : (cur - start);
  const progress = span > 0 ? Math.max(0, Math.min(100, Math.round((gone / span) * 100))) : 0;
  const remain = Math.max(0, down ? (cur - tgt) : (tgt - cur));

  let daysLeft = null, expected = null, perDay = null, pace = null;
  if (g.deadline) {
    const end = new Date(g.deadline + 'T00:00:00');
    const now = new Date(today() + 'T00:00:00');
    daysLeft = Math.ceil((end - now) / 86400000);

    if (daysLeft > 0) {
      perDay = remain / daysLeft;
      const startedAt = new Date((g.created_at || today()).slice(0, 10) + 'T00:00:00');
      const totalDays = Math.max(1, Math.ceil((end - startedAt) / 86400000));
      const elapsed = Math.max(0, Math.ceil((now - startedAt) / 86400000));
      expected = Math.min(100, Math.round((elapsed / totalDays) * 100));
      pace = progress >= expected ? 'ahead' : (expected - progress >= 15 ? 'behind' : 'ontrack');
    } else {
      pace = progress >= 100 ? 'ahead' : 'over';
    }
  }
  return { progress, remain, daysLeft, expected, perDay, pace, down, metric: g.metric || '개' };
}

/* 소수점은 필요할 때만 */
const trim = (n) => {
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
};

/* 하루치가 너무 작으면 "하루 0kg" 처럼 쓸모없는 문장이 된다.
   1 이상이 되는 단위(하루/주/달)로 올려서 말한다. */
function perText(perDay, metric) {
  const m = metric || '';
  if (perDay >= 1)      return `하루 ${trim(perDay)}${m}씩`;
  if (perDay * 7 >= 1)  return `주 ${trim(perDay * 7)}${m}씩`;
  return `한 달 ${trim(perDay * 30)}${m}씩`;
}

/* 복무 진행 상황. 입대일·전역일이 없으면 null. */
function service(d) {
  const s = d.settings || {};
  if (!s.service_start || !s.service_end) return null;
  const start = new Date(s.service_start + 'T00:00:00');
  const end = new Date(s.service_end + 'T00:00:00');
  const now = new Date(today() + 'T00:00:00');
  const day = Math.floor((now - start) / 86400000) + 1;   // 입대일이 1일차
  const left = Math.ceil((end - now) / 86400000);
  const totalDays = Math.floor((end - start) / 86400000) + 1;
  return { start: s.service_start, end: s.service_end, day, left, totalDays, pct: pct(day, totalDays) };
}

let ringSeq = 0;

/* 진행률 링. 그라데이션 획 + 0에서 차오르는 애니메이션. */
function ring(value, size, width, color) {
  const r = (size - width) / 2;
  const circ = 2 * Math.PI * r;
  const ns = 'http://www.w3.org/2000/svg';
  const id = 'rg' + (++ringSeq);
  const full = value >= 100;

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.style.display = 'block';
  svg.style.transform = 'rotate(-90deg)';

  const defs = document.createElementNS(ns, 'defs');
  const grad = document.createElementNS(ns, 'linearGradient');
  grad.setAttribute('id', id);
  grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
  grad.setAttribute('x2', '1'); grad.setAttribute('y2', '1');
  const stops = full ? ['#199e70', '#3fd39a'] : ['#3987e5', '#8fc7ff'];
  stops.forEach((c, i) => {
    const s = document.createElementNS(ns, 'stop');
    s.setAttribute('offset', i ? '100%' : '0%');
    s.setAttribute('stop-color', c);
    grad.append(s);
  });
  defs.append(grad);
  svg.append(defs);

  const bg = document.createElementNS(ns, 'circle');
  bg.setAttribute('cx', size / 2); bg.setAttribute('cy', size / 2); bg.setAttribute('r', r);
  bg.setAttribute('fill', 'none');
  bg.setAttribute('stroke', 'var(--track)');
  bg.setAttribute('stroke-width', width);

  const fg = document.createElementNS(ns, 'circle');
  fg.setAttribute('cx', size / 2); fg.setAttribute('cy', size / 2); fg.setAttribute('r', r);
  fg.setAttribute('fill', 'none');
  fg.setAttribute('stroke', color || `url(#${id})`);
  fg.setAttribute('stroke-width', width);
  fg.setAttribute('stroke-linecap', 'round');
  fg.setAttribute('stroke-dasharray', circ);
  fg.setAttribute('stroke-dashoffset', circ);   // 빈 상태에서 시작
  fg.style.transition = 'stroke-dashoffset .9s cubic-bezier(.2,.8,.3,1)';
  fg.style.filter = `drop-shadow(0 0 ${Math.max(3, width * 0.7)}px ${full ? 'rgba(25,158,112,.7)' : 'rgba(57,135,229,.65)'})`;

  svg.append(bg, fg);
  requestAnimationFrame(() => {
    fg.setAttribute('stroke-dashoffset', circ * (1 - Math.min(1, value / 100)));
  });
  return svg;
}

/* 숫자가 0에서 올라간다. 큰 값만 쓸 것. */
function countUp(node, to, suffix) {
  const dur = 900, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = num(Math.round(to * eased)) + (suffix || '');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function form(fields, onSubmit, submitLabel) {
  const wrap = el('div');
  const inputs = {};
  const build = (f) => {
    const holder = el('div');
    holder.append(el('label', null, f.label));
    let input;
    if (f.type === 'select') {
      input = el('select');
      f.options.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; input.append(o); });
    } else if (f.type === 'textarea') {
      input = el('textarea');
    } else {
      input = el('input');
      input.type = f.type || 'text';
      if (f.step) input.step = f.step;
      if (f.type === 'number') input.inputMode = 'decimal';
    }
    if (f.value !== undefined) input.value = f.value;
    if (f.placeholder) input.placeholder = f.placeholder;
    inputs[f.key] = input;
    holder.append(input);
    return holder;
  };
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i], next = fields[i + 1];
    if (f.half && next && next.half) {
      const pair = el('div', 'two');
      pair.append(build(f), build(next));
      wrap.append(pair);
      i++;
    } else wrap.append(build(f));
  }
  const btn = el('button', 'submit', submitLabel || '추가');
  btn.onclick = async () => {
    const body = {};
    for (const [k, input] of Object.entries(inputs)) {
      const v = input.value.trim();
      if (v !== '') body[k] = v;
    }
    btn.disabled = true; btn.textContent = '저장 중…';
    try { await onSubmit(body); }
    catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = submitLabel || '추가'; }
  };
  wrap.append(btn);
  return wrap;
}

/* 아래에서 올라오는 수정 시트. 기존 값을 채운 폼을 띄우고 PATCH 한다. */
function openEdit(title, fields, record, endpoint) {
  const back = el('div', 'sheetback');
  const sheet = el('div', 'sheet');
  const head = el('div', 'sheethead');
  head.append(el('h3', null, title));
  const x = el('button', 'mini', '닫기');
  x.onclick = () => back.remove();
  head.append(x);
  sheet.append(head);

  const filled = fields.map(f => ({ ...f, value: record[f.key] == null ? '' : String(record[f.key]) }));
  sheet.append(form(filled, async (body) => {
    // 비워둔 칸은 명시적으로 지운다. 안 그러면 한 번 쓴 값을 못 지운다.
    // 필수 칸(required)은 비워도 건드리지 않는다 — DB가 NOT NULL 이라 거절당한다.
    for (const f of fields) if (!(f.key in body) && !f.required) body[f.key] = '';
    await patch(endpoint, record.id, body, '수정했어');
    back.remove();
  }, '저장'));

  back.append(sheet);
  back.onclick = (e) => { if (e.target === back) back.remove(); };
  document.body.append(back);
  requestAnimationFrame(() => back.classList.add('open'));
}

}

function editBtn(title, fields, record, endpoint) {
  const b = el('button', 'mini', '수정');
  b.onclick = (e) => { e.stopPropagation(); openEdit(title, fields, record, endpoint); };
  return b;
}

function collapsed(title, node, open) {
  const d = el('details');
  if (open) d.open = true;
  d.append(el('summary', null, title), node);
  return d;
}

function goTab(id) {
  current = id;
  document.getElementById('title').textContent =
    current === 'home' ? '강승원 · 성장 기록' : `${TAB[current].emo} ${TAB[current].name}`;
  paintTabs();
  window.scrollTo({ top: 0 });
  render();
}

function paintTabs() {
  const nav = document.getElementById('tabs');
  [...nav.children].forEach((n) => {
    const id = n.dataset.tab;
    n.classList.toggle('on', id === 'more' ? !PRIMARY.includes(current) : id === current);
  });
}

/* 시트 껍데기. 제목 + 닫기 + 내용. */
function sheet(title, build) {
  const back = el('div', 'sheetback');
  const box = el('div', 'sheet');
  const head = el('div', 'sheethead');
  head.append(el('h3', null, title));
  const x = el('button', 'mini', '닫기');
  x.onclick = () => back.remove();
  head.append(x);
  box.append(head);
  build(box, () => back.remove());
  back.append(box);
  back.onclick = (e) => { if (e.target === back) back.remove(); };
  document.body.append(back);
  requestAnimationFrame(() => back.classList.add('open'));
  return back;
}

/* 3초 기록. 여기서 끝나는 것만 넣는다 — 탭을 옮겨야 하면 안 쓴다. */
function openQuickAdd(d) {
  sheet('빠른 기록', (box, close) => {
    const grid = el('div', 'quickgrid');
    const item = (emo, name, sub, fn) => {
      const b = el('button', 'quickitem');
      const t = el('div');
      t.append(document.createTextNode(name), el('span', 'qs', sub));
      b.append(el('span', 'qe', emo), t);
      b.onclick = () => { close(); fn(); };
      grid.append(b);
    };

    item('⚽', '골 (산출물)', '방금 내보낸 것', () => {
      const v = prompt('무엇을 내보냈나?');
      if (v && v.trim()) save('output', { date: today(), title: v.trim(), arena: 'etc' }, `+${XP.output} XP`);
    });
    const gs = d.goals.filter(g => g.status === 'active');
    if (gs.length) {
      item('🎯', '목표 +1', gs[0].title.slice(0, 14), () =>
        patch('goals', gs[0].id, { current_value: (+gs[0].current_value || 0) + 1, updated_at: new Date().toISOString() }, '기록했어'));
    }
    item('💪', '오늘 운동', '한 줄만', () => {
      const v = prompt('무슨 운동? (비워도 됨)', '');
      if (v === null) return;
      save('fitness', { date: today(), exercise_type: v.trim() || '운동' }, `+${XP.workout} XP`);
    });
    item('🧠', '숙달 카드', '들은 것 바로', () => {
      const v = prompt('항목 (예: 조명탄)');
      if (v && v.trim()) save('mastery', { term: v.trim(), category: 'knowledge' }, `+${XP.card} XP`);
    });
    item('🧩', '막힌 것', '지금 막힌 지점', () => {
      const v = prompt('무엇이 막혔나?');
      if (v && v.trim()) save('blockers', { title: v.trim(), category: 'execution', status: 'open' }, '기록했어');
    });
    item('📝', '노트', '방금 배운 것', () => {
      const v = prompt('한 줄 요약');
      if (v && v.trim()) save('notes', { title: v.trim(), source_type: 'life' }, `+${XP.note} XP`);
    });
    item('💰', '수입', '들어온 돈', () => {
      const v = prompt('얼마? (원)');
      if (!v || !v.trim()) return;
      const src = prompt('어디서?') || '기타';
      save('income', { date: today(), kind: 'income', amount: v.trim(), source: src }, '기록했어');
    });
    item('💡', '아이디어', '떠오른 것', () => {
      const v = prompt('아이디어');
      if (v && v.trim()) save('ideas', { title: v.trim(), status: 'seed' }, `+${XP.idea} XP`);
    });
    box.append(grid);
  });
}

/* 나머지 탭은 격자 시트로. 위에 늘어놓으면 엄지도 안 닿고 뭐가 있는지도 모른다. */
function openMore() {
  const back = el('div', 'sheetback');
  const sheet = el('div', 'sheet');
  const head = el('div', 'sheethead');
  head.append(el('h3', null, '전체'));
  const x = el('button', 'mini', '닫기');
  x.onclick = () => back.remove();
  head.append(x);
  sheet.append(head);

  const grid = el('div', 'moregrid');
  TABS.filter(t => !PRIMARY.includes(t.id)).forEach(t => {
    const b = el('button', 'moreitem' + (t.id === current ? ' on' : ''));

/* ============ 홈 ============ */

function viewHome(view, d) {
  const xp = total(d);
  const lv = levelOf(xp);
  const streak = streakOf(d);

  /* 레벨 */
  const tier = tierOf(lv.level);
  const hero = el('div', 'card herocard');
  const row = el('div', 'hero');
  const rw = el('div', 'lvlring');
  rw.append(ring(pct(lv.into, lv.need), 92, 9));
  const nn = el('div', 'num');
  nn.append(el('b', null, String(lv.level)), el('span', null, 'LEVEL'));
  rw.append(nn);

  const body = el('div', 'herobody');
  body.append(el('div', 'tier', `${tier.emo} ${tier.name}`));
  const xpLine = el('div', 'xp');
  body.append(xpLine);
  countUp(xpLine, xp, ' XP');
  body.append(el('div', 'next', `다음 레벨까지 ${num(lv.need - lv.into)} XP`));
  const tr = el('div', 'xptrack');
  const tf = el('div', 'xpfill');
  tf.style.width = '0%';
  requestAnimationFrame(() => { tf.style.width = pct(lv.into, lv.need) + '%'; });
  tr.append(tf);
  body.append(tr);
  row.append(rw, body);
  hero.append(row);
  view.append(hero);

  /* 주가 바뀌면 회고부터. 안 그러면 기록만 쌓이고 판단이 안 붙는다. */
  const ws = weekStart(0);
  const dow = (new Date().getDay() + 6) % 7;
  if (dow >= 5 && !d.reviews.some(r => r.week_start === ws)) {
    const rc = card('이번 주 회고');
    rc.append(el('div', 'empty', '한 주가 끝나간다. 5분이면 되고, 다음 주에 밀 하나만 정하면 된다.'));
    const b = el('button', 'submit', '회고 쓰기 (+40 XP)');
    b.onclick = () => goTab('review');
    rc.append(b);
    view.append(rc);
  }

  /* 목표 — 어디로 가는 중인가 */
  const active = d.goals.filter(g => g.status === 'active');
  if (active.length) {
    const gc = card('목표');
    /* 홈은 훑는 화면이다. 기한 급한 둘만 보이고 나머지는 탭에서. */
    const soon = [...active].sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
    soon.slice(0, 2).forEach(g => gc.append(goalBlock(g, d, true)));
    const more = el('button', 'mini', active.length > 2 ? `전체 ${active.length}개 보기` : '목표 탭 열기');
    more.style.marginTop = '4px';
    more.onclick = () => goTab('goals');
    gc.append(more);
    view.append(gc);
  } else {
    const gc = card('목표');
    gc.append(el('div', 'empty', '숫자로 끝나는 목표를 하나 넣으면, 여기에 진행률과 하루 필요량이 뜬다.'));
    const b = el('button', 'submit', '목표 만들기');
    b.onclick = () => goTab('goals');
    gc.append(b);
    view.append(gc);
  }

  /* 오늘의 퀘스트 */
  const qc = card('오늘의 퀘스트');
  const all = quests(d);
  if (!all.length) qc.append(el('div', 'empty', '탭에서 항목을 먼저 등록해줘.'));
  /* 안 끝난 것 먼저, 화면엔 다섯 개까지. 열 개 늘어놓으면 하나도 안 한다. */
  const ordered = [...all.filter(q => !q.done), ...all.filter(q => q.done)];
  const LIMIT = 5;
  const qs = questsOpen ? ordered : ordered.slice(0, LIMIT);
  qs.forEach(q => {
    const n = el('div', 'quest' + (q.done ? ' cleared' : ''));
    n.append(el('div', 'ico', q.emo));
    const t = el('div', 'qt');
    t.append(el('div', 't', q.title));
    t.append(el('div', 's', q.sub));
    if (q.cue) t.append(el('div', 'cue', '⏱ ' + q.cue));
    n.append(t);
    n.append(el('div', 'xpbadge', q.done ? '완료' : `+${q.xp}`));
    if (!q.done) n.onclick = () => { n.classList.add('firing'); q.act(); };
    qc.append(n);
  });
  if (ordered.length > LIMIT) {
    const t = el('button', 'mini', questsOpen ? '접기' : `＋ ${ordered.length - LIMIT}개 더`);
    t.style.marginTop = '4px';
    t.onclick = () => { questsOpen = !questsOpen; render(); };
    qc.append(t);
  }
  view.append(qc);

  /* 오늘 들고 나갈 한 가지 — 폰 없는 일과 중을 위한 장치 */
  view.append(carryCard(d));

  /* 영역별 진행 */
  const sc = card('영역별 진행');
  const g = el('div', 'rings');
  stats(d).forEach(s => {
    const cell = el('div', 'ringcell');
    const w = el('div', 'ringwrap');
    w.append(ring(s.pct, 56, 6));
    w.append(el('div', s.pct === null ? 'emo' : 'pctxt', s.pct === null ? s.emo : s.pct + '%'));
    cell.append(w, el('div', 'lab', `${s.emo} ${s.label}`), el('div', 'val', s.detail));
    g.append(cell);
  });
  sc.append(g);
  view.append(sc);

  /* 히트맵 */
  const hc = card('최근 12주 기록');
  const map = activityMap(d);
  const grid = el('div', 'heat');
  const start = new Date();
  start.setDate(start.getDate() - 83);
  start.setDate(start.getDate() - start.getDay()); // 일요일에 맞춘다
  // grid-auto-flow: column + 7개 행이라, i번째 칸은 (i/7)주차의 (i%7)요일에 놓인다.
  for (let i = 0; i < 7 * 13; i++) {
    const cellDate = new Date(start);
    cellDate.setDate(start.getDate() + i);
    const key = iso(cellDate);
    const c = map.get(key) || 0;
    const box = el('i');
    box.style.background = c === 0 ? 'var(--heat-0)' : c === 1 ? 'var(--heat-1)' : c === 2 ? 'var(--heat-2)' : c <= 4 ? 'var(--heat-3)' : 'var(--heat-4)';
    box.title = `${key} · 기록 ${c}건`;
    if (c >= 3) box.classList.add('lit');
    if (key === today()) box.classList.add('today');
    if (cellDate > new Date()) box.style.visibility = 'hidden';
    grid.append(box);
  }
  hc.append(grid);
  const lg = el('div', 'heatlegend');
  lg.append(el('span', null, '적음'));
  ['var(--heat-0)','var(--heat-1)','var(--heat-2)','var(--heat-3)','var(--heat-4)'].forEach(c => {
    const i2 = el('i'); i2.style.background = c; lg.append(i2);
  });
  lg.append(el('span', null, '많음'));
  hc.append(lg);
  view.append(hc);

  /* 업적 */
  const ac = card(`업적 ${ACHIEVEMENTS.filter(a => a.test(d)).length} / ${ACHIEVEMENTS.length}`);
  const bg = el('div', 'badges');
  let got = 0;
  ACHIEVEMENTS.forEach(a => {
    const has = a.test(d);
    const b = el('div', 'badge' + (has ? ' got' : ''));
    if (has) b.style.setProperty('--b', got++);
    b.append(el('div', 'e', a.emo), el('div', 'n', a.name));
    bg.append(b);
  });
  ac.append(bg);
  view.append(ac);
}

/* 오늘 들고 나갈 한 가지.
   폰을 못 보는 시간에 쓰는 장치라, 앱은 나가기 전과 돌아온 뒤에만 쓴다.
   아침에 하나 고르고 → 일과 중엔 머리로만 굴리고 → 저녁에 회수한다. */
function carryCard(d) {
  const c = card('오늘 들고 나갈 한 가지');
  const drill = d.drills.find(x => x.date === today());

  if (!drill) {
    if (!d.mastery.length) {
      c.append(el('div', 'empty', '숙달 탭에 항목을 하나 넣으면 여기서 매일 하나씩 뽑아준다.'));
      return c;
    }
    /* 낮은 단계 · 복습일이 지난 것부터 */
    const pool = [...d.mastery].sort((a, b) => {
      const ad = (a.next_review || '9999') <= today() ? 0 : 1;
      const bd = (b.next_review || '9999') <= today() ? 0 : 1;
      return ad - bd || (a.level || 0) - (b.level || 0);
    });
    const pick = pool[0];
    c.append(el('div', 'empty', '일과 나가기 전에 하나만 골라. 오늘은 이것만 머리에 넣고 나간다.'));
    const e = el('div', 'entry');
    e.append(el('div', 'et', pick.term));
    if (pick.cue) e.append(el('div', 'src', '실마리 · ' + pick.cue));
    const b = el('button', 'submit', '이걸로 들고 나가기');
    b.onclick = () => save('drills', { date: today(), mastery_id: pick.id, term_snapshot: pick.term }, '오늘 이거 하나');
    e.append(b);
    c.append(e);
    return c;
  }

  const e = el('div', 'entry');
  const h = el('div', 'eh');
  h.append(el('div', 'et', drill.term_snapshot || '오늘의 항목'));
  if (drill.recalled != null) {
    h.append(el('span', 'pill ' + (drill.unaided ? 'solved' : drill.recalled ? 'trying' : 'open'),
      drill.unaided ? '무의식' : drill.recalled ? '떠올림' : '못 떠올림'));
  }
  e.append(h);

  if (drill.recalled == null) {
    e.append(el('div', 'src', '일과 끝나고 돌아와서 눌러.'));
    const acts = el('div', 'acts');
    const no = el('button', 'mini danger', '못 떠올렸다');
    no.onclick = () => patch('drills', drill.id, { recalled: false, unaided: false }, '기록했어');
    const yes = el('button', 'mini go', '떠올렸다');
    yes.onclick = () => patch('drills', drill.id, { recalled: true, unaided: false }, '기록했어');
    const un = el('button', 'mini ok', `안 보고 나왔다 (+${XP.unaided}XP)`);
    un.onclick = async () => {
      const cardRow = d.mastery.find(m => m.id === drill.mastery_id);
      if (cardRow) await gradeCard(cardRow, true, true);
      await patch('drills', drill.id, { recalled: true, unaided: true }, `+${XP.unaided} XP`);
    };
    acts.append(no, yes, un);
    e.append(acts);
  } else {
    e.append(el('div', 'src', drill.unaided
      ? '몸에 붙었다. 이 항목은 간격이 늘어난다.'
      : drill.recalled ? '떠올랐지만 아직 의식적으로. 반복하면 붙는다.' : '내일 다시 이 항목이 올라온다.'));
  }
  c.append(e);

  const streak7 = d.drills.filter(x => x.date >= daysAgo(6));
  const un7 = streak7.filter(x => x.unaided).length;
  c.append(el('div', 'empty', `최근 7일 · 들고 나간 날 ${streak7.length}일 · 무의식으로 나온 날 ${un7}일`));
  return c;
}

/* 오늘 할 만한 것을 데이터에서 뽑아낸다. */
function quests(d) {
  const t = today();
  const out = [];

  const course = d.courses.find(c => c.status !== 'done' && (+c.completed_lectures || 0) < (+c.total_lectures || 0));
  if (course) {
    out.push({
      emo: '📚', xp: XP.lecture,
      title: '강의 1강 듣기',
      sub: `${course.name} · ${course.completed_lectures || 0}/${course.total_lectures}강`,
      done: false,
      act: () => patch('courses', course.id, {
        completed_lectures: (+course.completed_lectures || 0) + 1,
        status: (+course.completed_lectures || 0) + 1 >= (+course.total_lectures || 0) ? 'done' : 'in_progress'
      }, `+${XP.lecture} XP`)
    });
  }

  const trained = d.fitness.some(f => f.date === t);
  out.push({
    emo: '💪', xp: XP.workout,
    title: '오늘 운동 기록',
    sub: trained ? '오늘 기록함' : '체중이나 운동 남기기',
    done: trained,
    act: () => goTab('fitness')
  });

  const reading = d.books.find(b => b.status === 'reading');
  if (reading) {
    out.push({
      emo: '📖', xp: 5,
      title: '10쪽 읽기',
      sub: `${reading.title} · ${reading.current_page || 0}쪽`,
      done: false,
      act: () => patch('books', reading.id, { current_page: (+reading.current_page || 0) + 10 }, '+5 XP')
    });
  }

  const posted = d.mindpick.some(m => m.post_date === t);
  out.push({
    emo: '📱', xp: XP.post,
    title: '마인드픽 1개 올리기',
    sub: posted ? '오늘 올림' : '릴스든 카드뉴스든 하나',
    done: posted,
    act: () => goTab('mindpick')
  });

  /* 목표의 다음 과정이 최우선 퀘스트. 목표 없이 굴리는 하루가 제일 아깝다. */
  d.goals.filter(g => g.status === 'active').forEach(g => {
    const steps = d.steps.filter(x => String(x.goal_id) === String(g.id))
      .sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
    const next = steps.find(x => !x.done);
    if (!next) return;
    const s = goalStat(g);
    out.push({
      emo: '🎯', xp: XP.step,
      title: next.title,
      sub: `${g.title} · ${s.progress}%` + (s.perDay != null && s.remain > 0 ? ` · ${perText(s.perDay, g.metric)}` : ''),
      cue: next.when_cue || g.when_cue,
      done: false,
      act: () => patch('steps', next.id, { done: true, done_at: new Date().toISOString() }, `+${XP.step} XP`)
    });
  });

  const due = dueCards(d);
  if (due.length) {
    out.push({
      emo: '🧠', xp: XP.review * due.length,
      title: `숙달 복습 ${due.length}장`,
      sub: due.slice(0, 3).map(m => m.term).join(', '),
      done: false,
      act: () => goTab('mastery')
    });
  }

  const checked = d.selfcheck.some(s => s.date === t);
  out.push({
    emo: '🪞', xp: XP.check,
    title: '오늘 하루 메타인지 1개',
    sub: checked ? '오늘 점검함' : '선임 눈에 나는 몇 점이었나 · 근거와 함께',
    done: checked,
    act: () => goTab('selfcheck')
  });

  /* 적용 안 한 노트가 있으면 새 노트보다 그걸 먼저 민다. */
  const pending = d.notes.find(n => !n.applied && n.action);
  if (pending) {
    out.push({
      emo: '✅', xp: XP.applied,
      title: '노트 하나 실제로 적용하기',
      sub: pending.action.slice(0, 40),
      done: false,
      act: () => patch('notes', pending.id, { applied: true, updated_at: new Date().toISOString() }, `+${XP.applied} XP`)
    });
  } else {
    const noted = d.notes.some(n => (n.created_at || '').slice(0, 10) === t);
    out.push({
      emo: '📝', xp: XP.note,
      title: '오늘 배운 것 노트 1개',
      sub: noted ? '오늘 남김' : '책·강의·경험 아무거나',
      done: noted,
      act: () => goTab('notes')
    });
  }

  const stuck = d.blockers.filter(b => b.status !== 'solved')[0];
  if (stuck) {
    out.push({
      emo: '🧩', xp: XP.solved,
      title: '막힌 것 하나 풀기',
      sub: stuck.title.slice(0, 40),
      done: false,
      act: () => goTab('blockers')
    });
  }

  const staleP = d.people.find(p => p.keep && (!p.last_contact || p.last_contact < daysAgo(30)));
  if (staleP) {
    out.push({
      emo: '🤝', xp: XP.person,
      title: `${staleP.name} 에게 먼저 연락`,
      sub: staleP.next_action || '오래 연락 안 함',
      done: false,
      act: () => patch('people', staleP.id, { last_contact: t }, '기록했어')
    });
  }

  const task = d.military
    .filter(x => x.status !== 'done')
    .sort((a, b) => (a.target_date || '9999').localeCompare(b.target_date || '9999'))[0];
  if (task) {
    out.push({
      emo: '🪖', xp: XP.task,
      title: task.task,
      sub: task.target_date ? `목표 ${task.target_date}` : '군대',
      done: false,
      act: () => patch('military', task.id, { status: 'done', completed_at: new Date().toISOString() }, `+${XP.task} XP`)
    });
  }

  return out;
}

function stats(d) {
  const doneL = d.courses.reduce((s, c) => s + (+c.completed_lectures || 0), 0);
  const totL  = d.courses.reduce((s, c) => s + (+c.total_lectures || 0), 0);
  const week  = d.fitness.filter(f => f.date >= daysAgo(6)).length;
  const reading = d.books.filter(b => b.status === 'reading');
  const readPct = reading.length
    ? Math.round(reading.reduce((s, b) => s + pct(+b.current_page || 0, +b.total_pages || 0), 0) / reading.length)
    : null;
  const month = d.mindpick.filter(m => m.post_date >= daysAgo(29)).length;
  const mDone = d.military.filter(x => x.status === 'done').length;

  const applied = d.notes.filter(n => n.applied).length;
  const solved  = d.blockers.filter(b => b.status === 'solved').length;
  const sv      = service(d);

  const mast = d.mastery.filter(m => (m.level || 0) >= 2).length;

  return [
    { emo: '🧠', label: '숙달',      pct: d.mastery.length ? pct(mast, d.mastery.length) : null, detail: d.mastery.length ? `구사 ${mast}/${d.mastery.length}` : '없음' },
    { emo: '📝', label: '노트 적용', pct: d.notes.length ? pct(applied, d.notes.length) : null, detail: d.notes.length ? `${applied}/${d.notes.length}` : '없음' },
    { emo: '🧩', label: '돌파',      pct: d.blockers.length ? pct(solved, d.blockers.length) : null, detail: d.blockers.length ? `${solved}/${d.blockers.length}` : '없음' },
    { emo: '🔥', label: '연속',      pct: pct(streakOf(d), 30),                 detail: `${streakOf(d)}일` },
    { emo: '📚', label: '강의',      pct: totL ? pct(doneL, totL) : null,       detail: totL ? `${doneL}/${totL}강` : '없음' },
    { emo: '💪', label: '운동',      pct: pct(week, 7),                         detail: `주 ${week}일` },
    { emo: '📖', label: '독서',      pct: readPct,                              detail: reading.length ? `${reading.length}권 읽는 중` : '없음' },
    { emo: '📱', label: '마인드픽',   pct: pct(month, 12),                       detail: `30일 ${month}개` },
    { emo: '🤝', label: '사람',      pct: d.people.length ? pct(d.people.filter(p => p.keep).length, d.people.length) : null, detail: d.people.length ? `${d.people.length}명` : '없음' },
    { emo: '🪖', label: '전역',      pct: sv ? sv.pct : null, detail: sv ? `D-${num(sv.left)}` : (d.military.length ? `${mDone}/${d.military.length}` : '없음') }
  ];
}

  { key: 'apply', label: '내가 쓸 것', type: 'textarea' },
  { key: 'result', label: '써본 결과', type: 'textarea' }
];

/* 능력치 6축. 순위는 골 하나로 매기고, 스탯은 여러 축으로 본다.
   순위가 여러 개면 흐려지고, 스탯이 하나면 내 모양이 안 보인다. */
function stats6(d) {
  const w4 = (arr, f) => arr.filter(x => f(x) >= daysAgo(27)).length;

  const body = pct(w4(d.fitness, f => f.date), 16);                       // 4주에 16회 = 주 4
  const out  = pct(w4(d.output, o => o.date), 20);                        // 4주에 20개 = 주 5
  const keep = pct(streakOf(d), 30);
  const aware = pct(w4(d.selfcheck, s => s.date), 4);                     // 주 1회

  const mast = d.mastery.length ? pct(d.mastery.filter(m => (m.level || 0) >= 2).length, d.mastery.length) : 0;
  const appl = d.notes.length ? pct(d.notes.filter(n => n.applied).length, d.notes.length) : 0;
  const brain = Math.round((mast + appl) / 2);

  const steal = d.steal.length
    ? Math.round(pct(d.steal.filter(s => s.used).length, d.steal.length) * Math.min(1, d.steal.length / 5))
    : 0;

  return [
    { k: 'body',  emo: '💪', name: '몸',    v: body,  hint: '최근 4주 운동 · 주 4회 기준' },
    { k: 'brain', emo: '🧠', name: '두뇌',  v: brain, hint: '구사 이상 비율 + 노트 적용률' },
    { k: 'out',   emo: '⚽', name: '산출',  v: out,   hint: '최근 4주 산출 · 주 5개 기준' },
    { k: 'keep',  emo: '🔥', name: '지속',  v: keep,  hint: '연속 기록 · 30일 기준' },
    { k: 'aware', emo: '🪞', name: '자각',  v: aware, hint: '최근 4주 메타인지 · 주 1회 기준' },
    { k: 'steal', emo: '🎣', name: '흡수',  v: steal, hint: '흡수 적용률 (5개 이상일 때 만점 가능)' }
  ];
}

/* 메타비전 — 판을 얼마나 정확히 읽는가.
   여섯 축은 "내가 뭘 얼마나 하는가"고, 이건 "내가 그 결과를 맞히는가"다.
   실적은 운으로도 나오지만 예측 적중은 운으로 안 나온다. */
function metavision(d) {
  const pairs = d.output
    .filter(o => +o.predicted_reach > 0 && +o.reach > 0)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
    .slice(0, 8);                                  // 최근 8개 — 옛날 감은 지금 감이 아니다

  if (!pairs.length) return { n: 0, score: 0, ready: false, pairs: [] };

  const errs = pairs.map(o => {
    const p = +o.predicted_reach, a = +o.reach;
    return { o, p, a, err: Math.abs(a - p) / Math.max(a, p), over: p > a };
  });
  const mean = errs.reduce((s, e) => s + e.err, 0) / errs.length;
  return {
    n: errs.length,
    score: Math.max(0, Math.round((1 - mean) * 100)),
    ready: errs.length >= 3,
    over: errs.filter(e => e.over).length,
    pairs: errs
  };
}

/* 이사기도 여섯 개를 먼저 세우고, 판이 보이기 시작한 뒤에 다이렉트 슛을 뽑았다.
   순서를 뒤집으면 무기가 아니라 편식이 된다. */
function phaseOf(st, mv) {
  const low = Math.min(...st.map(x => x.v));
  if (low < 40) return {
    n: 1, name: '균형기', emo: '🧱',
    line: '아직 무기를 고를 때가 아니다. 제일 낮은 축부터 40까지.',
    why: `최저 축 ${low} · 40 넘으면 다음 단계`
  };
  if (!mv.ready) return {
    n: 2, name: '관측기', emo: '👁️',
    line: '축은 섰다. 이제 판이 보이는지 확인할 차례 — 올리기 전에 결과를 먼저 적어라.',
    why: `예측·실제 짝 ${mv.n}개 · 3개부터 메타비전이 계산됨`
  };
  return {
    n: 3, name: '특화기', emo: '⚔️',
    line: '판이 읽힌다. 이제 하나에 몰아넣어도 되는 구간이다.',
    why: `최저 축 ${low} · 메타비전 ${mv.score}`
  };
}

/* 육각형 레이더. 한 사람의 한 시점이라 계열은 하나 — 색도 하나만 쓴다. */
function radar(items, size) {
  const ns = 'http://www.w3.org/2000/svg';
  const cx = size / 2, cy = size / 2, R = size * 0.31;
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('width', '100%');
  svg.style.display = 'block';

  const at = (i, r) => {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / items.length;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  const poly = (pts, fill, stroke, w, op) => {
    const p = document.createElementNS(ns, 'polygon');
    p.setAttribute('points', pts.map(q => q.join(',')).join(' '));
    p.setAttribute('fill', fill);
    p.setAttribute('stroke', stroke);
    p.setAttribute('stroke-width', w);
    if (op) p.setAttribute('fill-opacity', op);
    p.setAttribute('stroke-linejoin', 'round');
    return p;
  };

  /* 눈금 — 뒤로 물러나 있어야 데이터가 읽힌다 */
  [0.25, 0.5, 0.75, 1].forEach(f => {
    svg.append(poly(items.map((_, i) => at(i, R * f)), 'none', 'var(--line)', 1));
  });
  items.forEach((_, i) => {
    const [x, y] = at(i, R);
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', cx); l.setAttribute('y1', cy);
    l.setAttribute('x2', x);  l.setAttribute('y2', y);
    l.setAttribute('stroke', 'var(--line)');
    l.setAttribute('stroke-width', 1);
    svg.append(l);
  });

  /* 값 */
  const pts = items.map((it, i) => at(i, R * Math.max(0.02, it.v / 100)));
  svg.append(poly(pts, 'var(--accent)', 'var(--accent)', 2, 0.28));
  pts.forEach(([x, y]) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 3.5);
    c.setAttribute('fill', 'var(--accent)');
    c.setAttribute('stroke', 'var(--card)');
    c.setAttribute('stroke-width', 2);
    svg.append(c);
  });

  /* 축 이름 + 수치는 직접 라벨로. 범례 상자는 필요 없다. */
  items.forEach((it, i) => {
    const [x, y] = at(i, R * 1.34);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('font-size', '12');
    t.setAttribute('fill', 'var(--muted)');
    t.textContent = `${it.emo} ${it.name}`;
    svg.append(t);

    const v = document.createElementNS(ns, 'text');
    v.setAttribute('x', x); v.setAttribute('y', y + 15);
    v.setAttribute('text-anchor', 'middle');
    v.setAttribute('dominant-baseline', 'middle');
    v.setAttribute('font-size', '13');
    v.setAttribute('font-weight', '750');
    v.setAttribute('fill', 'var(--text)');
    v.textContent = it.v;
    svg.append(v);
  });

  return svg;
}

  } else {
    mc.append(el('div', 'mvbig', String(mv.score)));

  const nextR = RANKS.slice().reverse().find(x => x.min > cur.length);
  if (nextR) rb.append(el('div', 'need', `${nextR.r} 등급까지 ${nextR.min - cur.length}골`));
  row.append(rb);
  rc.append(row);

  /* 최근 8주 */

}

/* ---------- 💰 수익 ---------- */

const money = (n) => {
  const v = Math.round(+n || 0);
  const a = Math.abs(v);
  if (a >= 100000000) return (v / 100000000).toFixed(a >= 1000000000 ? 0 : 2).replace(/\.00$/, '') + '억';
  if (a >= 10000)     return Math.round(v / 10000).toLocaleString('ko-KR') + '만';
  return v.toLocaleString('ko-KR');
};

const monthKey = (v) => String(v).slice(0, 7);
const thisMonth = () => monthKey(today());
function monthsBack(n) {
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - n);
  return d.toISOString().slice(0, 7);
}

function monthNet(d, mk) {
  let inc = 0, exp = 0;
  d.income.forEach(r => {
    if (monthKey(r.date) !== mk) return;
    if (r.kind === 'expense') exp += +r.amount || 0; else inc += +r.amount || 0;
  });
  return { inc, exp, net: inc - exp };
}

const INCOME_FIELDS = [
  { key: 'date', label: '날짜', type: 'date' },
  { key: 'kind', label: '종류', type: 'select', options: [['income', '수입'], ['expense', '지출']], half: true },
  { key: 'amount', required: true, label: '금액 (원)', type: 'number', half: true },
  { key: 'source', required: true, label: '어디서', placeholder: '예) 마인드픽 제휴 / 영상 외주' },
  { key: 'note', label: '메모', type: 'textarea' }
];

function viewIncome(view, d) {
  const target = +(d.settings?.income_target || 100000000);
  const cur = monthNet(d, thisMonth());
  const prev = monthNet(d, monthsBack(1));
  const best = d.income.length
    ? Math.max(...[...new Set(d.income.map(r => monthKey(r.date)))].map(mk => monthNet(d, mk).net))
    : 0;

  /* 북극성 */
  const head = el('div', 'card herocard');
  head.append(el('h2', null, '이번 달 순이익'));
  const big = el('div');
  big.style.cssText = 'font-size:2.5rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1';
  big.textContent = money(cur.net) + '원';
  head.append(big);

  const sub = el('div', 'next');
  const diff = cur.net - prev.net;
  sub.textContent = `수입 ${money(cur.inc)} · 지출 ${money(cur.exp)}` +
    (prev.net ? `  ·  지난달 대비 ${diff >= 0 ? '▲' : '▼'} ${money(Math.abs(diff))}` : '');
  head.append(sub);

  const tr = el('div', 'xptrack');
  const tf = el('div', 'xpfill');
  tf.style.width = '0%';
  requestAnimationFrame(() => { tf.style.width = pct(Math.max(0, cur.net), target) + '%'; });
  tr.append(tf);
  head.append(tr);

  /* 절대 퍼센트만 보면 매일 0%라 사람 죽는다. 배수로 말한다. */
  const gap = el('div', 'need');
  if (cur.net >= target) gap.textContent = `목표 달성. 월 ${money(target)}원 넘겼다 🎉`;
  else if (cur.net > 0) gap.textContent = `목표 ${money(target)}원까지 — 지금의 ${(target / cur.net).toFixed(1)}배`;
  else gap.textContent = `목표 ${money(target)}원. 첫 1원부터가 배수의 시작이다.`;
  head.append(gap);

  const setBtn = el('button', 'mini', '목표 금액 바꾸기');
  setBtn.style.marginTop = '12px';
  setBtn.onclick = () => {
    const v = prompt('월 순이익 목표 (원)', String(target));
    if (v && v.trim()) api('settings', { method: 'POST', body: JSON.stringify({ income_target: v.trim() }) })
      .then(() => { DATA = null; toast('바꿨어', 'good'); render(); });
  };
  head.append(setBtn);
  view.append(head);

  /* 역산 — 목표를 오늘 팔 것으로 바꾼다 */
  const calc = card('역산');
  calc.append(el('div', 'empty', '객단가를 정하면 몇 명이 필요한지 나온다. 막연한 1억이 사람 수로 바뀐다.'));
  const rows = [10000, 30000, 100000, 300000, 1000000];
  rows.forEach(p => {
    const need = Math.ceil(target / p);
    const r = el('div', 'item');
    const g = el('div', 'grow');
    g.append(el('div', 't', `객단가 ${money(p)}원`));
    g.append(el('div', 'm', `한 달 ${need.toLocaleString('ko-KR')}명 · 하루 ${Math.ceil(need / 30).toLocaleString('ko-KR')}명`));
    r.append(g);
    calc.append(r);
  });
  view.append(calc);

  /* 월별 추이 */
  if (d.income.length) {
    const tc = card('월별 순이익');
    const maxAbs = Math.max(1, best, ...[0, 1, 2, 3, 4, 5].map(i => Math.abs(monthNet(d, monthsBack(i)).net)));
    for (let i = 5; i >= 0; i--) {
      const mk = monthsBack(i);
      const n = monthNet(d, mk).net;
      bar(tc, mk, Math.max(0, n), maxAbs, money(n) + '원');
    }
    view.append(tc);
  }

  const f = card();
  f.append(collapsed('＋ 수입 · 지출 기록', form(
    INCOME_FIELDS.map(x => x.key === 'date' ? { ...x, value: today() } : x),
    b => { b.kind = b.kind || 'income'; b.date = b.date || today(); return save('income', b, '기록했어'); }
  ), !d.income.length));
  view.append(f);

  if (d.income.length) {
    const lc = card('기록');
    d.income.slice(0, 40).forEach(r => {
      const it = el('div', 'item');
      const g = el('div', 'grow');
      g.append(el('div', 't', r.source));
      g.append(el('div', 'm', [r.date, r.note].filter(Boolean).join(' · ')));
      it.append(g);
      const amt = el('div', null, (r.kind === 'expense' ? '−' : '+') + money(r.amount));
      amt.style.cssText = `font-weight:700;font-variant-numeric:tabular-nums;color:${r.kind === 'expense' ? 'var(--urgent)' : 'var(--done)'}`;
      it.append(amt);
      const del = el('button', 'mini danger', '×');
      del.onclick = () => remove('income', r.id, r.source);
      it.append(del);
      lc.append(it);
    });
    view.append(lc);
  }
}

/* ---------- 📜 기록함 ---------- */

/* 흩어진 15개 테이블을 한 줄기로 모은다.
   "그거 어디 적었더라" 를 해결하는 게 목적이라, 날짜와 검색만 있으면 된다. */
function allRecords(d) {
  const out = [];
  const push = (date, kind, emo, title, sub, tab) => {
    if (!date || !title) return;
    out.push({ date: String(date).slice(0, 10), kind, emo, title: String(title), sub: sub || '', tab });
  };

  d.notes.forEach(n => push(n.created_at, '노트', '📝', n.title,
    [n.source_label, n.applied ? '적용함' : null, n.action].filter(Boolean).join(' · '), 'notes'));
  d.blockers.forEach(b => push(b.created_at, '막힌 것', '🧩', b.title,
    [CAT_LABEL[b.category], b.status === 'solved' ? '해결: ' + (b.solution || '') : '미해결'].filter(Boolean).join(' · '), 'blockers'));
  d.people.forEach(p => push(p.met_at || p.created_at, '사람', '🤝', p.name,
    [p.met_where, p.learned].filter(Boolean).join(' · '), 'people'));
  d.ideas.forEach(i => push(i.created_at, '아이디어', '💡', i.title,
    [IDEA_LABEL[i.status], i.detail].filter(Boolean).join(' · '), 'ideas'));
  d.mastery.forEach(m => push(m.created_at, '숙달', '🧠', m.term,
    [MCAT_LABEL[m.category], LEVELS[m.level || 0].name, m.meaning].filter(Boolean).join(' · '), 'mastery'));
  d.selfcheck.forEach(s => push(s.date, '메타인지', '🪞', s.area,
    [s.self_score != null ? `나 ${s.self_score} / 선임 ${s.other_score}` : null, s.evidence].filter(Boolean).join(' · '), 'selfcheck'));
  d.books.forEach(b => push(b.finished_at || b.created_at, '독서', '📖', b.title,
    [b.author, b.status === 'finished' ? '완독' : null, b.notes].filter(Boolean).join(' · '), 'books'));
  d.courses.forEach(c => push(c.created_at, '강의', '📚', c.name,
    [c.platform, `${c.completed_lectures || 0}/${c.total_lectures}강`].filter(Boolean).join(' · '), 'courses'));
  d.fitness.forEach(f => push(f.date, '운동', '💪', f.exercise_type || '운동 기록',
    [f.weight ? f.weight + 'kg' : null, f.sets ? f.sets + '세트' : null, f.notes].filter(Boolean).join(' · '), 'fitness'));
  d.mindpick.forEach(m => push(m.post_date, '마인드픽', '📱', m.content || '게시물',
    `도달 ${num(m.reach)} · ❤️ ${num(m.likes)}`, 'mindpick'));
  d.military.forEach(t => push(t.completed_at || t.created_at, '복무', '🪖', t.task,
    [t.category, t.status === 'done' ? '완료' : '진행'].filter(Boolean).join(' · '), 'military'));
  d.goals.forEach(g => push(g.created_at, '목표', '🎯', g.title,
    `${trim(+g.current_value)}/${trim(+g.target_value)}${g.metric || ''} · ${goalStat(g).progress}%`, 'goals'));
  d.steps.filter(s => s.done).forEach(s => {
    const g = d.goals.find(x => String(x.id) === String(s.goal_id));
    push(s.done_at, '과정', '🪜', s.title, g ? g.title : '', 'goals');
  });
  d.output.forEach(r => push(r.date, '산출물', '⚽', r.title,
    [ARENA[r.arena]?.name, r.reach ? `도달 ${num(r.reach)}` : null, r.note].filter(Boolean).join(' · '), 'bluelock'));
  d.steal.forEach(r => push(r.created_at, '흡수', '🎣', `${r.target} — ${r.what}`,
    [r.how, r.used ? '써봄' : null].filter(Boolean).join(' · '), 'bluelock'));
  d.income.forEach(r => push(r.date, '수익', '💰', r.source,
    `${r.kind === 'expense' ? '지출' : '수입'} ${money(r.amount)}원`, 'income'));
  d.reviews.forEach(r => push(r.week_start, '회고', '📅', `${r.week_start} 주간 회고`,
    r.focus ? '다음 주: ' + r.focus : '', 'review'));

  return out.sort((a, b) => b.date.localeCompare(a.date));
}

let archQuery = '';
let archKind = 'all';

function viewArchive(view, d) {
  const all = allRecords(d);
  const kinds = [...new Set(all.map(r => r.kind))];

  const head = card('기록함');
  head.append(el('div', 'empty', `지금까지 남긴 기록 ${all.length}개. 여기서 다 찾을 수 있다.`));

  const search = el('input');
  search.type = 'search';
  search.placeholder = '검색 — 단어 아무거나';
  search.value = archQuery;
  search.style.marginTop = '12px';
  /* 입력 중에 다시 그리면 포커스가 날아간다. 목록만 갈아끼운다. */
  search.oninput = () => { archQuery = search.value; paint(); };
  head.append(search);

  const seg = el('div', 'seg');
  seg.style.marginTop = '12px';
  [['all', `전체 ${all.length}`], ...kinds.map(k => [k, k])].forEach(([v, t]) => {
    const b = el('button', archKind === v ? 'on' : '', t);
    b.onclick = () => {
      archKind = v;
      [...seg.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      paint();
    };
    seg.append(b);
  });
  head.append(seg);
  view.append(head);

  const listCard = card();
  view.append(listCard);

  function paint() {
    listCard.replaceChildren();
    const q = archQuery.trim().toLowerCase();
    const rows = all.filter(r =>
      (archKind === 'all' || r.kind === archKind) &&
      (!q || (r.title + ' ' + r.sub + ' ' + r.kind).toLowerCase().includes(q)));

    if (!rows.length) {
      listCard.append(el('div', 'empty', q ? `"${archQuery}" 로 찾은 게 없다.` : '아직 기록이 없다.'));
      return;
    }

    let lastDay = null;
    rows.slice(0, 200).forEach(r => {
      if (r.date !== lastDay) {
        lastDay = r.date;
        const h = el('div', 'daysep', r.date);
        listCard.append(h);
      }
      const it = el('div', 'item arch');
      it.append(el('div', 'aemo', r.emo));
      const g = el('div', 'grow');
      const t = el('div', 't');
      t.textContent = r.title;
      t.style.whiteSpace = 'normal';
      g.append(t);
      if (r.sub) {
        const s = el('div', 'm', r.sub);
        s.style.whiteSpace = 'normal';
        g.append(s);
      }
      it.append(g);
      it.append(el('span', 'pill', r.kind));
      it.style.cursor = 'pointer';
      it.onclick = () => goTab(r.tab);
      listCard.append(it);
    });
    if (rows.length > 200) listCard.append(el('div', 'empty', `외 ${rows.length - 200}개 — 검색으로 좁혀봐`));
  }
  paint();
}

/* ---------- 📅 주간 회고 ---------- */

/* 이번 주 월요일 */
function weekStart(offset) {
  const d = new Date();
  const dow = (d.getDay() + 6) % 7;              // 월=0
  d.setDate(d.getDate() - dow - (offset || 0) * 7);
  return iso(d);
}

/* 한 주 동안 실제로 움직인 것만 센다 */
function weekStats(d, ws) {
  const we = iso(new Date(new Date(ws + 'T00:00:00').getTime() + 6 * 86400000));
  const inWeek = (v) => v && String(v).slice(0, 10) >= ws && String(v).slice(0, 10) <= we;
  const map = activityMap(d);
  let activeDays = 0;
  for (let i = 0; i < 7; i++) {
    const day = iso(new Date(new Date(ws + 'T00:00:00').getTime() + i * 86400000));
    if (map.has(day)) activeDays++;
  }
  return {
    ws, we, activeDays,
    steps:    d.steps.filter(s => s.done && inWeek(s.done_at)).length,
    notes:    d.notes.filter(n => inWeek(n.created_at)).length,
    applied:  d.notes.filter(n => n.applied && inWeek(n.updated_at)).length,
    solved:   d.blockers.filter(b => b.status === 'solved' && inWeek(b.solved_at)).length,
    reviews:  d.mastery.filter(m => inWeek(m.last_review)).length,
    unaided:  d.drills.filter(x => x.unaided && inWeek(x.date)).length,
    workouts: d.fitness.filter(f => inWeek(f.date)).length,
    posts:    d.mindpick.filter(m => inWeek(m.post_date)).length,
    checks:   d.selfcheck.filter(s => inWeek(s.date)).length
  };
}

function viewReview(view, d) {
  const ws = weekStart(0);
  const st = weekStats(d, ws);
  const prev = weekStats(d, weekStart(1));
  const saved = d.reviews.find(r => r.week_start === ws);

  const head = card(`이번 주 (${ws} ~ ${st.we})`);
  const g = el('div', 'rings');
  const tile = (emo, v, label, delta) => {
    const c = el('div', 'ringcell');
    const n = el('div', null, String(v));
    n.style.cssText = 'font-size:1.3rem;font-weight:750;font-variant-numeric:tabular-nums';
    c.append(el('div', null, emo), n, el('div', 'lab', label));
    if (delta !== undefined && delta !== 0) {
      const dd = el('div', 'val', (delta > 0 ? '▲ ' : '▼ ') + Math.abs(delta));
      dd.style.color = delta > 0 ? 'var(--done)' : 'var(--faint)';
      c.append(dd);
    }
    return c;
  };
  g.append(
    tile('🗓', `${st.activeDays}/7`, '기록한 날', st.activeDays - prev.activeDays),
    tile('🪜', st.steps, '과정 완료', st.steps - prev.steps),
    tile('🧩', st.solved, '돌파', st.solved - prev.solved),
    tile('🧠', st.reviews, '복습', st.reviews - prev.reviews),
    tile('🌀', st.unaided, '무의식', st.unaided - prev.unaided),
    tile('✅', st.applied, '노트 적용', st.applied - prev.applied)
  );
  head.append(g);
  view.append(head);

  /* 목표 페이스 점검 */
  const active = d.goals.filter(x => x.status === 'active');
  if (active.length) {
    const pc = card('목표 페이스');
    active.forEach(x => {
      const s = goalStat(x);
      bar(pc, x.title, s.progress, 100, `${s.progress}%` + (s.pace ? ` · ${PACE_TEXT[s.pace][0]}` : ''));
    });
    const behind = active.filter(x => goalStat(x).pace === 'behind');
    if (behind.length) {
      pc.append(el('div', 'empty', `뒤처진 것 ${behind.length}개 — 다음 주 집중은 여기서 고르는 게 맞다.`));
    }
    view.append(pc);
  }

  /* 관찰 — 규칙으로 뽑는다. 판단은 네가 한다. */
  const obs = [];
  if (st.notes > 0 && st.applied === 0) obs.push(`노트 ${st.notes}개 썼는데 적용은 0개. 읽기만 한 주.`);
  if (st.activeDays <= 2) obs.push(`기록한 날 ${st.activeDays}일. 시스템이 아니라 습관이 끊긴 것.`);
  if (st.unaided > 0) obs.push(`안 보고 나온 게 ${st.unaided}번. 숙달 쪽은 굴러가는 중.`);
  if (st.solved === 0 && d.blockers.some(b => b.status !== 'solved')) obs.push('막힌 것이 그대로 남아 있다. 한 주에 하나는 풀어야 쌓이지 않는다.');
  if (st.steps === 0 && active.length) obs.push('과정을 하나도 못 끝냈다. 단계가 너무 큰 건 아닌지 확인.');
  if (weekOutputs(d, 0).length === 0) obs.push('이번 주 산출물 0개. 내보낸 게 없으면 반응도 없고 배울 것도 없다.');
  if (!d.income.length) obs.push('수익 기록이 하나도 없다. 결과지표를 안 재면 지금 하는 게 맞는 방향인지 알 수 없다.');
  if (obs.length) {
    const oc = card('관찰');
    obs.forEach(o => {
      const r = el('div', 'item');
      r.append(el('div', 'grow', o));
      oc.append(r);
    });
    view.append(oc);
  }

  /* 회고 쓰기 */
  const fc = card(saved ? '이번 주 회고 (저장됨)' : '회고 쓰기');
  const fields = [
    { key: 'went_well', label: '잘된 것', type: 'textarea', value: saved?.went_well || '' },
    { key: 'went_bad', label: '안 된 것 · 왜', type: 'textarea', value: saved?.went_bad || '' },
    { key: 'focus', required: true, label: '다음 주에 밀 단 하나', placeholder: '여러 개 적으면 하나도 안 된다', value: saved?.focus || '' }
  ];
  fc.append(form(fields, async (b) => {
    b.week_start = ws;
    b.snapshot = JSON.stringify(st);
    if (saved) await patch('reviews', saved.id, b, '회고 저장');
    else await save('reviews', b, '회고 저장 +40 XP');
  }, saved ? '수정 저장' : '저장'));
  view.append(fc);

  const past = d.reviews.filter(r => r.week_start !== ws);
  if (past.length) {
    const hc = card('지난 회고');
    past.forEach(r => {
      const e = el('div', 'entry');
      e.append(el('div', 'et', r.week_start));
      if (r.focus) {
        const x = el('div', 'field act');
        x.append(el('div', 'k', '그 주의 하나'), el('div', 'v', r.focus));
        e.append(x);
      }
      if (r.went_bad) {
        const x = el('div', 'field');
        x.append(el('div', 'k', '안 된 것'), el('div', 'v', r.went_bad));
        e.append(x);
      }
      hc.append(e);
    });
    view.append(hc);
  }
}
