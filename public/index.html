  { key: 'target_value', label: '목표 수치', type: 'number', half: true },
  { key: 'current_value', label: '현재 수치', type: 'number', half: true },
  { key: 'direction', label: '방향', type: 'select', options: [['up', '올리기'], ['down', '줄이기 (체중 등)']], half: true },
  { key: 'deadline', label: '기한', type: 'date' },
  { key: 'when_cue', label: '언제 · 어디서 할 건가', placeholder: '예) 점호 후 생활관에서' },
  { key: 'why', label: '왜 이 목표인가', type: 'textarea' }
];

/* 목표 하나를 카드로. compact 면 홈용 요약. */
function goalBlock(g, d, compact) {
  const s = goalStat(g);
  const steps = d.steps.filter(x => String(x.goal_id) === String(g.id))
    .sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
  const doneSteps = steps.filter(x => x.done).length;
  const nextStep = steps.find(x => !x.done);

  const e = el('div', 'entry goal');
  const h = el('div', 'eh');
  h.append(el('div', 'et', g.title));
  if (s.pace) {
    const [txt, cls] = PACE_TEXT[s.pace];
    h.append(el('span', 'pill ' + cls, txt));
  }
  e.append(h);

  const meta = [
    GCAT_LABEL[g.category] || g.category,
    s.daysLeft != null ? (s.daysLeft > 0 ? `D-${s.daysLeft}` : '기한 지남') : '기한 없음'
  ].filter(Boolean).join(' · ');
  e.append(el('div', 'src', meta));

  /* 큰 진행 막대 */
  const nums = el('div', 'goalnums');
  const now = el('span', 'gnow');
  now.textContent = `${trim(+g.current_value || 0)}${g.metric || ''}`;
  const tgt = el('span', 'gtgt');
  tgt.textContent = `/ ${trim(+g.target_value || 0)}${g.metric || ''}`;
  const pctTag = el('span', 'gpct');
  pctTag.textContent = s.progress + '%';
  nums.append(now, tgt, el('span', 'gspacer'), pctTag);
  e.append(nums);

  const track = el('div', 'track gtrack');
  const fill = el('div', 'fill');
  fill.style.width = '0%';
  requestAnimationFrame(() => { fill.style.width = s.progress + '%'; });
  if (s.progress >= 100) fill.classList.add('full');
  track.append(fill);
  /* 지금쯤 와 있어야 하는 지점 */
  if (s.expected != null && s.expected < 100) {
    const mark = el('div', 'expmark');
    mark.style.left = s.expected + '%';
    mark.title = `지금쯤 ${s.expected}%`;
    track.append(mark);
  }
  e.append(track);

  /* 필요 속도 — 정량 목표를 오늘 할 일로 바꾸는 줄 */
  if (s.perDay != null && s.remain > 0) {
    const need = el('div', 'need');
    need.textContent = `남은 ${trim(s.remain)}${g.metric || ''} · ${s.daysLeft}일 → ${perText(s.perDay, g.metric)}`;
    e.append(need);
  } else if (s.progress >= 100) {
    const need = el('div', 'need done');
    need.textContent = '목표 달성 🎉';
    e.append(need);
  }

  /* 언제·어디서가 붙어야 실제로 실행된다 */
  const cueText = (nextStep && nextStep.when_cue) || g.when_cue;
  if (cueText) e.append(el('div', 'cue', '⏱ ' + cueText));

  if (compact) {
    if (nextStep) e.append(el('div', 'src', '다음 · ' + nextStep.title));
    return e;
  }

  /* 빠른 기록 */
  const quick = el('div', 'acts');
  const bump = (n) => {
    const b = el('button', 'mini' + (n > 0 ? ' go' : ''), (n > 0 ? '+' : '') + n);
    b.onclick = () => patch('goals', g.id, {
      current_value: (+g.current_value || 0) + n,
      updated_at: new Date().toISOString()
    });
    return b;
  };
  quick.append(bump(1), bump(5), bump(-1));
  const setv = el('button', 'mini', '직접 입력');
  setv.onclick = () => {
    const v = prompt(`"${g.title}" 현재 수치`, g.current_value);
    if (v !== null && v.trim() !== '') patch('goals', g.id, { current_value: v.trim(), updated_at: new Date().toISOString() });
  };
  quick.append(setv);
  e.append(quick);

  /* 과정 */
  const stepWrap = el('div', 'steps');
  const shead = el('div', 'stephead');
  shead.append(el('span', null, `과정 ${doneSteps}/${steps.length}`));
  stepWrap.append(shead);

  if (!steps.length) {
    stepWrap.append(el('div', 'empty', '과정을 쪼개 넣으면 홈 퀘스트에 하나씩 올라온다.'));
  }
  steps.forEach(st => {
    const row = el('div', 'steprow' + (st.done ? ' done' : ''));
    const box = el('button', 'chk' + (st.done ? ' on' : ''), st.done ? '✓' : '');
    box.onclick = () => patch('steps', st.id, {
      done: !st.done,
      done_at: st.done ? '' : new Date().toISOString()
    }, st.done ? '되돌림' : `+${XP.step} XP`);
    const t = el('div', 'grow');
    t.append(el('div', 't', st.title));
    const sm = [st.when_cue ? '⏱ ' + st.when_cue : null, st.target_date].filter(Boolean).join(' · ');
    if (sm) t.append(el('div', 'm', sm));
    const cue = el('button', 'mini', st.when_cue ? '⏱' : '⏱＋');
    cue.title = '언제·어디서 할지 정하기';
    cue.onclick = () => {
      const v = prompt('언제 · 어디서 할 건가?\n(예: 점호 후 생활관에서)', st.when_cue || '');
      if (v !== null) patch('steps', st.id, { when_cue: v.trim() });
    };
    const del = el('button', 'mini danger', '×');
    del.onclick = () => remove('steps', st.id, st.title);
    row.append(box, t, cue, del);
    stepWrap.append(row);
  });

  const addStep = el('button', 'mini', '＋ 과정 추가');
  addStep.onclick = () => {
    const v = prompt('과정 하나 (작게 쪼갤수록 좋다)');
    if (v && v.trim()) save('steps', { goal_id: g.id, title: v.trim(), order_index: steps.length }, '과정 추가');
  };
  stepWrap.append(addStep);
  e.append(stepWrap);

  const acts = el('div', 'acts');
  if (g.status === 'active' && s.progress >= 100) {
    const fin = el('button', 'mini ok', `달성 처리 (+${XP.goalDone}XP)`);
    fin.onclick = () => patch('goals', g.id, { status: 'done' }, `+${XP.goalDone} XP 🎉`);
    acts.append(fin);
  }
  const del = el('button', 'mini danger', '삭제');
  del.onclick = () => remove('goals', g.id, g.title);
  acts.append(editBtn('목표 수정', GOAL_FIELDS, g, 'goals'), del);
  e.append(acts);
  return e;
}

function viewGoals(view, d) {
  const active = d.goals.filter(g => g.status === 'active');
  const done = d.goals.filter(g => g.status === 'done');

  const head = card('목표');
  if (active.length) {
    const avg = Math.round(active.reduce((s, g) => s + goalStat(g).progress, 0) / active.length);
    const behind = active.filter(g => goalStat(g).pace === 'behind').length;
    const g2 = el('div', 'rings');
    const tile = (emo, v, label) => {
      const c = el('div', 'ringcell');
      const n = el('div', null, v);
      n.style.cssText = 'font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums';
      c.append(el('div', null, emo), n, el('div', 'lab', label));
      return c;
    };
    g2.append(tile('🎯', String(active.length), '진행 중'), tile('📊', avg + '%', '평균 진행'), tile('⚠️', String(behind), '뒤처짐'));
    head.append(g2);
  } else {
    head.append(el('div', 'empty',
      '숫자로 끝나는 목표를 넣어. "영상 잘하기"는 목표가 아니다. "릴스 30개 올리기"가 목표다.'));
  }
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 목표 추가', form(GOAL_FIELDS, b => {
    b.category = b.category || 'other';
    b.direction = b.direction || 'up';
    b.metric = b.metric || '개';
    if (b.start_value == null) b.start_value = b.current_value || 0;
    return save('goals', b, '목표 등록');
  }), !d.goals.length));
  view.append(f);

  if (active.length) {
    const c = card('진행 중');
    active.forEach(g => c.append(goalBlock(g, d, false)));
    view.append(c);
  }
  if (done.length) {
    const c = card(`달성 ${done.length}`);
    done.forEach(g => {
      const e = el('div', 'entry');
      const h = el('div', 'eh');
      h.append(el('div', 'et', g.title));
      h.append(el('span', 'pill solved', '달성'));
      e.append(h);
      e.append(el('div', 'src', `${trim(+g.target_value)}${g.metric || ''} 도달`));
      const acts = el('div', 'acts');
      const re = el('button', 'mini', '다시 열기');
      re.onclick = () => patch('goals', g.id, { status: 'active' });
      const del = el('button', 'mini danger', '삭제');
      del.onclick = () => remove('goals', g.id, g.title);
      acts.append(re, del);
      e.append(acts);
      c.append(e);
    });
    view.append(c);
  }
}

/* ---------- 🧠 숙달 ---------- */

const MASTERY_FIELDS = [
  { key: 'term', required: true, label: '항목', placeholder: '예) 고폭탄 / 몽키렌치 / 불발 시 조치' },
  { key: 'category', label: '분류', type: 'select', options: MASTERY_CATS },
  { key: 'meaning', label: '내용 · 기능', type: 'textarea' },
  { key: 'cue', label: '떠올리는 실마리', placeholder: '연상, 두문자, 손에 익은 순서' },
  { key: 'why', label: '왜 이게 중요한가 (궁구)', type: 'textarea' },
  { key: 'when_cue', label: '언제 · 어디서 굴릴 건가', placeholder: '예) 아침 점호 줄 서서' }
];

const dueCards = (d) => d.mastery.filter(m => !m.next_review || m.next_review <= today());

/* 복습 결과 반영. 맞으면 한 단계 올리고 간격을 늘린다. */
function gradeCard(card, ok, unaided) {
  const lv = ok ? Math.min(3, (card.level || 0) + 1) : Math.max(0, (card.level || 0) - 1);
  const next = new Date();
  next.setDate(next.getDate() + (ok ? LEVELS[lv].days : 1));
  return patch('mastery', card.id, {
    level: lv,
    reps: (card.reps || 0) + 1,
    lapses: (card.lapses || 0) + (ok ? 0 : 1),
    unaided_count: (card.unaided_count || 0) + (unaided ? 1 : 0),
    last_review: today(),
    next_review: iso(next)
  });
}

let reviewQueue = null;   // 복습 중인 카드 배열
let reviewShown = false;  // 답을 열었는가
let questsOpen = false;   // 홈 퀘스트를 다 펼쳤는가

function viewMastery(view, d) {
  const rows = d.mastery;
  const due = dueCards(d);

  /* 복습 모드 */
  if (reviewQueue && reviewQueue.length) {
    const card = rows.find(m => m.id === reviewQueue[0]) || null;
    if (!card) { reviewQueue.shift(); return viewMastery(view, d); }

    const c = el('div', 'card pop');
    const top = el('div', 'rowtop');
    top.append(el('span', 'n', `${MCAT_LABEL[card.category] || card.category} · ${LEVELS[card.level || 0].emo} ${LEVELS[card.level || 0].name}`),
               el('span', 'v', `남은 ${reviewQueue.length}장`));
    c.append(top);

    const q = el('div');
    q.style.cssText = 'font-size:1.35rem;font-weight:700;line-height:1.35;margin:18px 0 4px;letter-spacing:-.02em';
    q.textContent = card.term;
    c.append(q);

    if (!reviewShown) {
      if (card.cue) {
        const cue = el('div', null, '실마리 · ' + card.cue);
        cue.style.cssText = 'font-size:.8rem;color:var(--faint);margin-bottom:18px';
        c.append(cue);
      }
      const show = el('button', 'submit', '답 보기');
      show.onclick = () => { reviewShown = true; render(); };
      c.append(show);
    } else {
      const fld = (k, v, cls) => {
        if (!v) return;
        const f = el('div', 'field' + (cls ? ' ' + cls : ''));
        f.append(el('div', 'k', k), el('div', 'v', v));
        c.append(f);
      };
      fld('내용', card.meaning);
      fld('실마리', card.cue);
      fld('왜 중요한가', card.why, 'act');

      const hint = el('div', null, '안 보고 떠올랐으면 "무의식" 을 눌러. 그게 진짜 숙달이야.');
      hint.style.cssText = 'font-size:.76rem;color:var(--faint);margin:16px 0 8px';
      c.append(hint);

      const acts = el('div', 'acts');
      const no = el('button', 'mini danger', '못 떠올림');
      no.onclick = async () => { await gradeCard(card, false, false); reviewQueue.shift(); reviewShown = false; render(); };
      const yes = el('button', 'mini go', '떠올랐다');
      yes.onclick = async () => { await gradeCard(card, true, false); reviewQueue.shift(); reviewShown = false; render(); };
      const un = el('button', 'mini ok', `무의식 (+${XP.unaided}XP)`);
      un.onclick = async () => { await gradeCard(card, true, true); reviewQueue.shift(); reviewShown = false; render(); };
      acts.append(no, yes, un);
      c.append(acts);
    }

    const quit = el('button', 'mini', '복습 그만');
    quit.style.marginTop = '14px';
    quit.onclick = () => { reviewQueue = null; reviewShown = false; render(); };
    c.append(quit);

    view.append(c);
    return;
  }
  if (reviewQueue) { reviewQueue = null; toast('복습 끝!', 'good'); }

  /* 요약 */
  const head = card('숙달');
  const g = el('div', 'rings');
  const byLevel = n => rows.filter(m => (m.level || 0) === n).length;
  [1, 2, 3].forEach(n => {
    const cell = el('div', 'ringcell');
    const w = el('div', 'ringwrap');
    w.append(ring(rows.length ? pct(rows.filter(m => (m.level || 0) >= n).length, rows.length) : 0, 56, 6));
    w.append(el('div', 'pctxt', String(rows.filter(m => (m.level || 0) >= n).length)));
    cell.append(w, el('div', 'lab', `${LEVELS[n].emo} ${LEVELS[n].name}`), el('div', 'val', `이상 ${rows.filter(m => (m.level || 0) >= n).length}개`));
    g.append(cell);
  });
  head.append(g);
  const sum = el('div', 'empty', `전체 ${rows.length}개 · 오늘 복습할 것 ${due.length}개 · 아직 모르는 것 ${byLevel(0)}개`);
  head.append(sum);
  if (due.length) {
    const start = el('button', 'submit', `복습 시작 (${due.length}장)`);
    start.onclick = () => { reviewQueue = due.map(m => m.id); reviewShown = false; render(); };
    head.append(start);
  }
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 항목 추가', form(MASTERY_FIELDS, b => {
    b.category = b.category || 'knowledge';
    return save('mastery', b, `+${XP.card} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty',
      '선임이 알려준 것을 그날 바로 넣어. 탄종 하나, 렌치 하나씩이면 된다. ' +
      '내용은 네가 직접 써야 머리에 남는다 — 받아적은 걸 그대로 옮기지 말고 네 말로 바꿔서.'));
    view.append(e);
    return;
  }

  MASTERY_CATS.forEach(([cat, label]) => {
    const group = rows.filter(m => m.category === cat);
    if (!group.length) return;
    const c = card(`${label} ${group.length}`);
    group.sort((a, b) => (a.level || 0) - (b.level || 0)).forEach(m => {
      const e = el('div', 'entry');
      const h = el('div', 'eh');
      h.append(el('div', 'et', m.term));
      h.append(el('span', 'pill' + ((m.level || 0) >= 3 ? ' solved' : (m.level || 0) >= 2 ? ' trying' : ''),
        `${LEVELS[m.level || 0].emo} ${LEVELS[m.level || 0].name}`));
      e.append(h);
      const meta = [
        m.next_review ? (m.next_review <= today() ? '오늘 복습' : `다음 ${m.next_review}`) : '복습 예정 없음',
        `${m.reps || 0}회`,
        (m.unaided_count || 0) ? `무의식 ${m.unaided_count}회` : null
      ].filter(Boolean).join(' · ');
      e.append(el('div', 'src', meta));
      if (m.meaning) {
        const x = el('div', 'field');
        x.append(el('div', 'k', '내용'), el('div', 'v', m.meaning));
        e.append(x);
      }
      if (m.why) {
        const x = el('div', 'field act');
        x.append(el('div', 'k', '왜 중요한가'), el('div', 'v', m.why));
        e.append(x);
      }
      const acts = el('div', 'acts');
      const del = el('button', 'mini danger', '삭제');
      del.onclick = () => remove('mastery', m.id, m.term);
      acts.append(editBtn('항목 수정', MASTERY_FIELDS, m, 'mastery'), del);
      e.append(acts);
      c.append(e);
    });
    view.append(c);
  });
}

/* ---------- 🪞 메타인지 ---------- */

const CHECK_FIELDS = [
  { key: 'area', label: '영역', type: 'select', options: AREAS.map(a => [a, a]) },
  { key: 'self_score', label: '내가 보는 나 (1~5)', type: 'number', half: true },
  { key: 'other_score', label: '선임이 볼 나 (1~5)', type: 'number', half: true },
  { key: 'evidence', required: true, label: '근거 — 실제로 있었던 일만', type: 'textarea' },
  { key: 'gap_note', label: '차이가 난다면 왜', type: 'textarea' },
  { key: 'action', label: '다음에 바꿀 것 하나' },
  { key: 'date', label: '날짜', type: 'date' }
];

function viewSelfcheck(view, d) {
  const rows = d.selfcheck;

  const head = card('메타인지');
  head.append(el('div', 'empty',
    '내 눈의 나와 선임 눈의 나는 다르다. 바꿀 수 있는 건 남이 아니라 그 차이다. ' +
    '점수보다 근거 칸이 중요하다 — 느낌 말고 실제로 있었던 일만 적는다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 점검 기록', form(CHECK_FIELDS.map(x => x.key === 'date' ? { ...x, value: today() } : x), b => {
    b.area = b.area || AREAS[0];
    b.date = b.date || today();
    return save('selfcheck', b, `+${XP.check} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  /* 영역별 평균 간극 */
  const gapCard = card('영역별 간극');
  AREAS.forEach(area => {
    const g = rows.filter(r => r.area === area && r.self_score != null && r.other_score != null);
    if (!g.length) return;
    const self = g.reduce((s, r) => s + r.self_score, 0) / g.length;
    const other = g.reduce((s, r) => s + r.other_score, 0) / g.length;
    const diff = (self - other).toFixed(1);
    const row = el('div', 'row');
    const top = el('div', 'rowtop');
    top.append(el('span', 'n', area),
               el('span', 'v', `나 ${self.toFixed(1)} · 선임 ${other.toFixed(1)} · 차 ${diff > 0 ? '+' : ''}${diff}`));
    const track = el('div', 'track');
    const fl = el('div', 'fill');
    fl.style.width = pct(other, 5) + '%';
    if (Math.abs(diff) <= 0.5) fl.classList.add('full');
    track.append(fl);
    row.append(top, track);
    gapCard.append(row);
  });
  gapCard.append(el('div', 'empty', '막대는 선임이 볼 점수. 차이가 0.5 이내면 초록.'));
  view.append(gapCard);

  const listCard = card('기록');
  rows.forEach(r => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', r.area));
    if (r.self_score != null && r.other_score != null) {
      const diff = r.self_score - r.other_score;
      h.append(el('span', 'pill' + (Math.abs(diff) <= 1 ? ' solved' : ' open'),
        `나 ${r.self_score} / 선임 ${r.other_score}`));
    }
    e.append(h);
    e.append(el('div', 'src', r.date));
    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('근거', r.evidence);
    fld('왜 차이 나나', r.gap_note);
    fld('바꿀 것', r.action, 'act');
    const acts = el('div', 'acts');
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('selfcheck', r.id, r.area + ' ' + r.date);
    acts.append(editBtn('점검 수정', CHECK_FIELDS, r, 'selfcheck'), del);
    e.append(acts);
    listCard.append(e);
  });
  view.append(listCard);
}

/* ---------- 📝 노트 ---------- */

const NOTE_FIELDS = (d) => [
  { key: 'title', required: true, label: '한 줄 요약', placeholder: '예) 정체성이 먼저, 행동은 그 다음' },
  { key: 'source_type', label: '출처 종류', type: 'select', options: [['book','책'],['course','강의'],['life','삶 · 경험']], half: true },
  { key: 'source_label', label: '출처', placeholder: '예) 역행자 · 3장', half: true },
  { key: 'quote', label: '원문 / 핵심', type: 'textarea' },
  { key: 'insight', label: '내 해석 — 이게 왜 중요한가', type: 'textarea' },
  { key: 'action', label: '적용 — 구체적으로 뭘 할 건가', type: 'textarea' }
];

function noteCard(n) {
  const e = el('div', 'entry');
  const h = el('div', 'eh');
  h.append(el('div', 'et', n.title));
  h.append(el('span', 'pill' + (n.applied ? ' applied' : ''), n.applied ? '적용함' : '미적용'));
  e.append(h);

  const src = [n.source_type === 'book' ? '책' : n.source_type === 'course' ? '강의' : '삶', n.source_label, (n.created_at || '').slice(0, 10)]
    .filter(Boolean).join(' · ');
  if (src) e.append(el('div', 'src', src));

  const fld = (k, v, cls) => {
    if (!v) return;
    const f = el('div', 'field' + (cls ? ' ' + cls : ''));
    f.append(el('div', 'k', k), el('div', 'v', v));
    e.append(f);
  };
  fld('원문', n.quote);
  fld('내 해석', n.insight);
  fld('적용', n.action, 'act');

  const acts = el('div', 'acts');
  const tog = el('button', 'mini' + (n.applied ? '' : ' ok'), n.applied ? '미적용으로' : `적용함 (+${XP.applied}XP)`);
  tog.onclick = () => patch('notes', n.id, { applied: !n.applied, updated_at: new Date().toISOString() },
    n.applied ? '되돌림' : `+${XP.applied} XP`);
  const del = el('button', 'mini danger', '삭제');
  del.onclick = () => remove('notes', n.id, n.title);
  acts.append(tog, editBtn('노트 수정', NOTE_FIELDS(), n, 'notes'), del);
  e.append(acts);
  return e;
}

function viewNotes(view, d) {
  const rows = d.notes;
  const applied = rows.filter(n => n.applied).length;

  const head = card('노트');
  const g = el('div', 'rings');
  const tile = (emo, v, label) => {
    const c = el('div', 'ringcell');
    const n = el('div', null, v);
    n.style.cssText = 'font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums';
    c.append(el('div', null, emo), n, el('div', 'lab', label));
    return c;
  };
  g.append(tile('📝', String(rows.length), '전체'), tile('✅', String(applied), '적용함'), tile('⏳', String(rows.length - applied), '아직'));
  head.append(g);
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 노트 추가', form(NOTE_FIELDS(), b => {
    b.source_type = b.source_type || 'book';
    return save('notes', b, `+${XP.note} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty', '책이나 강의에서 건진 것 하나만 적어봐. 나중에 여기서 다시 찾아 읽고, 적용했는지 체크할 수 있어.'));
    view.append(e);
    return;
  }

  const notApplied = rows.filter(n => !n.applied);
  if (notApplied.length) {
    const c = card(`아직 적용 안 한 것 ${notApplied.length}개`);
    notApplied.forEach(n => c.append(noteCard(n)));
    view.append(c);
  }
  const done = rows.filter(n => n.applied);
  if (done.length) {
    const c = card(`적용한 것 ${done.length}개`);
    done.forEach(n => c.append(noteCard(n)));
    view.append(c);
  }
}

/* ---------- 🧩 막힌 것 ---------- */

const BLOCKER_FIELDS = [
  { key: 'title', required: true, label: '무엇이 막혔나', placeholder: '예) 릴스를 찍긴 하는데 끝까지 안 봄' },
  { key: 'category', label: '분류', type: 'select', options: BLOCKER_CATS, half: true },
  { key: 'source', label: '어디서 나왔나', placeholder: '예) 힉스필드 강의', half: true },
  { key: 'detail', label: '구체적으로 어떤 상황인지', type: 'textarea' },
  { key: 'attempts', label: '시도해본 것', type: 'textarea' },
  { key: 'solution', label: '찾은 해결점', type: 'textarea' }
];

let blockerFilter = 'all';

function viewBlockers(view, d) {
  const rows = d.blockers;
  const solved = rows.filter(b => b.status === 'solved');

  const head = card('막힌 것 → 해결');
  bar(head, '돌파율', solved.length, rows.length, `${solved.length} / ${rows.length}개`);
  head.append(el('div', 'empty', '실행이 막히는 지점을 적어두고, 해결점을 찾으면 채운다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 막힌 것 추가', form(BLOCKER_FIELDS, b => {
    b.category = b.category || 'execution';
    b.status = b.solution ? 'solved' : 'open';
    if (b.solution) b.solved_at = new Date().toISOString();
    return save('blockers', b, b.solution ? `+${XP.solved} XP` : '기록했어');
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  const listCard = card();
  const seg = el('div', 'seg');
  [['all', '전체'], ...BLOCKER_CATS].forEach(([v, t]) => {
    const b = el('button', blockerFilter === v ? 'on' : '', t);
    b.onclick = () => { blockerFilter = v; render(); };
    seg.append(b);
  });
  listCard.append(seg);

  const shown = rows.filter(b => blockerFilter === 'all' || b.category === blockerFilter);
  const order = { open: 0, trying: 1, solved: 2 };
  shown.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));

  if (!shown.length) listCard.append(el('div', 'empty', '이 분류엔 없어'));

  shown.forEach(b => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', b.title));
    h.append(el('span', 'pill ' + b.status, b.status === 'solved' ? '해결' : b.status === 'trying' ? '시도 중' : '막힘'));
    e.append(h);

    const src = [CAT_LABEL[b.category] || b.category, b.source].filter(Boolean).join(' · ');
    if (src) e.append(el('div', 'src', src));

    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('상황', b.detail);
    fld('시도한 것', b.attempts);
    fld('해결점', b.solution, 'sol');

    const acts = el('div', 'acts');
    if (b.status !== 'solved') {
      if (b.status === 'open') {
        const t = el('button', 'mini', '시도 중으로');
        t.onclick = () => patch('blockers', b.id, { status: 'trying' });
        acts.append(t);
      }
      const s = el('button', 'mini ok', `해결됨 (+${XP.solved}XP)`);
      s.onclick = () => {
        const v = prompt('어떻게 풀었어? (해결점)', b.solution || '');
        if (v === null) return;
        patch('blockers', b.id, { status: 'solved', solution: v, solved_at: new Date().toISOString() }, `+${XP.solved} XP`);
      };
      acts.append(s);
    } else {
      const u = el('button', 'mini', '다시 열기');
      u.onclick = () => patch('blockers', b.id, { status: 'open', solved_at: '' });
      acts.append(u);
    }
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('blockers', b.id, b.title);
    acts.append(editBtn('막힌 것 수정', BLOCKER_FIELDS, b, 'blockers'), del);
    e.append(acts);
    listCard.append(e);
  });
  view.append(listCard);
}

/* ---------- 🤝 사람 ---------- */

const PEOPLE_FIELDS = [
  { key: 'name', required: true, label: '이름 / 닉네임' },
  { key: 'met_where', label: '어디서', placeholder: '예) 스레드 DM, 독서모임', half: true },
  { key: 'met_at', label: '처음 만난 날', type: 'date', half: true },
  { key: 'tags', label: '태그', placeholder: '예) 마케팅, 영상, 글쓰기' },
  { key: 'learned', label: '이 사람에게서 배운 것', type: 'textarea' },
  { key: 'next_action', label: '다음에 할 것', placeholder: '예) 만든 릴스 보여주고 피드백 받기' },
  { key: 'last_contact', label: '마지막 연락', type: 'date' }
];

function viewPeople(view, d) {
  const rows = d.people;
  const stale = rows.filter(p => p.keep && (!p.last_contact || p.last_contact < daysAgo(30)));

  const head = card('사람');
  const g = el('div', 'rings');
  const tile = (emo, v, label) => {
    const c = el('div', 'ringcell');
    const n = el('div', null, v);
    n.style.cssText = 'font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums';
    c.append(el('div', null, emo), n, el('div', 'lab', label));
    return c;
  };
  g.append(
    tile('🤝', String(rows.length), '전체'),
    tile('⭐', String(rows.filter(p => p.keep).length), '이어갈 사람'),
    tile('📮', String(stale.length), '연락한 지 오래')
  );
  head.append(g);
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 사람 추가', form(PEOPLE_FIELDS, b => save('people', b, `+${XP.person} XP`)), !rows.length));
  view.append(f);

  if (!rows.length) {
    const e = card();
    e.append(el('div', 'empty',
      '오프라인에서 만나기 어려운 상황이면 온라인 접점을 세는 게 낫다. 스레드에서 답글 준 사람, 댓글 단 사람, 도움 받은 사람부터 하나씩.'));
    view.append(e);
    return;
  }

  if (stale.length) {
    const c = card(`먼저 연락해볼 사람 ${stale.length}명`);
    stale.forEach(p => {
      const it = el('div', 'item');
      const g2 = el('div', 'grow');
      g2.append(el('div', 't', p.name));
      g2.append(el('div', 'm', p.next_action || (p.last_contact ? `마지막 연락 ${p.last_contact}` : '연락 기록 없음')));
      it.append(g2);
      const ok = el('button', 'mini go', '연락함');
      ok.onclick = () => patch('people', p.id, { last_contact: today() }, '기록했어');
      it.append(ok);
      c.append(it);
    });
    view.append(c);
  }

  const listCard = card('전체');
  rows.forEach(p => {
    const e = el('div', 'entry');
    const h = el('div', 'eh');
    h.append(el('div', 'et', p.name));
    if (p.keep) h.append(el('span', 'pill applied', '이어감'));
    e.append(h);
    const src = [p.met_where, p.met_at, p.tags].filter(Boolean).join(' · ');
    if (src) e.append(el('div', 'src', src));
    const fld = (k, v, cls) => {
      if (!v) return;
      const x = el('div', 'field' + (cls ? ' ' + cls : ''));
      x.append(el('div', 'k', k), el('div', 'v', v));
      e.append(x);
    };
    fld('배운 것', p.learned);
    fld('다음에 할 것', p.next_action, 'act');

    const acts = el('div', 'acts');
    const ct = el('button', 'mini', '오늘 연락함');
    ct.onclick = () => patch('people', p.id, { last_contact: today() }, '기록했어');
    const kp = el('button', 'mini', p.keep ? '이어가기 해제' : '이어갈 사람');
    kp.onclick = () => patch('people', p.id, { keep: !p.keep });
    const del = el('button', 'mini danger', '삭제');
    del.onclick = () => remove('people', p.id, p.name);
    acts.append(ct, kp, editBtn('사람 수정', PEOPLE_FIELDS, p, 'people'), del);
    e.append(acts);
    listCard.append(e);
  });
  view.append(listCard);
}

/* ---------- 💡 아이디어 ---------- */

const IDEA_FIELDS = [
  { key: 'title', required: true, label: '아이디어' },
  { key: 'category', label: '분류', placeholder: '예) 콘텐츠 / 제품 / 사업', half: true },
  { key: 'status', label: '상태', type: 'select', options: IDEA_STATUS, half: true },
  { key: 'detail', label: '설명 — 누구의 어떤 문제를 푸는가', type: 'textarea' }
];

function viewIdeas(view, d) {
  const rows = d.ideas;

  const head = card('아이디어함');
  head.append(el('div', 'empty', '떠오른 걸 흘려보내지 않는 곳. 씨앗 → 만드는 중 → 내보냄 으로 옮긴다.'));
  view.append(head);

  const f = card();
  f.append(collapsed('＋ 아이디어 추가', form(IDEA_FIELDS, b => {
    b.status = b.status || 'seed';
    return save('ideas', b, `+${XP.idea} XP`);
  }), !rows.length));
  view.append(f);

  if (!rows.length) return;

  IDEA_STATUS.forEach(([st, label]) => {
    const group = rows.filter(i => i.status === st);
    if (!group.length) return;
    const c = card(`${label} ${group.length}`);
    group.forEach(i => {
      const e = el('div', 'entry');
      const h = el('div', 'eh');
      h.append(el('div', 'et', i.title));
      h.append(el('span', 'pill' + (st === 'shipped' ? ' solved' : st === 'building' ? ' trying' : ''), label));
      e.append(h);
      if (i.category) e.append(el('div', 'src', i.category));
      if (i.detail) {
        const x = el('div', 'field');
        x.append(el('div', 'k', '설명'), el('div', 'v', i.detail));
        e.append(x);
      }
      const acts = el('div', 'acts');
      if (st === 'seed') {
        const b1 = el('button', 'mini go', '만들기 시작');
        b1.onclick = () => patch('ideas', i.id, { status: 'building' });
        acts.append(b1);
      }
      if (st === 'building') {
        const b2 = el('button', 'mini ok', `내보냄 (+${XP.shipped}XP)`);
        b2.onclick = () => patch('ideas', i.id, { status: 'shipped' }, `+${XP.shipped} XP`);
        acts.append(b2);
      }
      if (st !== 'dropped' && st !== 'shipped') {
        const b3 = el('button', 'mini', '접기');
        b3.onclick = () => patch('ideas', i.id, { status: 'dropped' });
        acts.append(b3);
      }
      const del = el('button', 'mini danger', '삭제');
      del.onclick = () => remove('ideas', i.id, i.title);
      acts.append(editBtn('아이디어 수정', IDEA_FIELDS, i, 'ideas'), del);
      e.append(acts);
      c.append(e);
    });
    view.append(c);
  });
}

const VIEWS = {
  home: viewHome, goals: viewGoals, bluelock: viewBluelock, income: viewIncome, archive: viewArchive, review: viewReview, mastery: viewMastery, selfcheck: viewSelfcheck,
  notes: viewNotes, blockers: viewBlockers, people: viewPeople, ideas: viewIdeas,
  courses: viewCourses, fitness: viewFitness, books: viewBooks, mindpick: viewMindpick, military: viewMilitary
};

/* ============ 부팅 ============ */

/* 첫 로딩은 빈 화면 대신 뼈대를 보여준다 */
function skeleton(view) {
  [[92, 1], [150, 2], [220, 3]].forEach(([h, i]) => {
    const c = card();
    c.style.setProperty('--i', i);
    const s = el('div', 'skel');
    s.style.height = h + 'px';
    c.append(s);
    view.append(c);
  });
}

async function render() {
  const view = document.getElementById('view');
  if (!view.childElementCount) skeleton(view);

  try {
    const d = await loadAll();
    const si = streakInfo(d);
    const chip = document.getElementById('streakchip');
    chip.textContent = `🔥 ${si.days}일` + (si.freezeLeft ? ' 🛡' : '');
    chip.title = si.freezeLeft ? '방탄 1장 있음 — 하루 빠져도 안 끊긴다' : '방탄 사용함 — 7일 지나면 다시 생김';
    chip.classList.toggle('hot', si.days >= 3);

    /* 레벨이 올랐으면 축하 연출. 기기에 남긴 이전 레벨과 비교한다. */
    const lvNow = levelOf(total(d)).level;
    const seen = Number(localStorage.getItem('lastLevel') || 0);
    localStorage.setItem('lastLevel', String(lvNow));
    if (seen && lvNow > seen) setTimeout(() => levelUpShow(lvNow), 380);

    const fresh = document.createElement('div');
    VIEWS[current](fresh, d);
    [...fresh.children].forEach((n, i) => n.style.setProperty('--i', i));
    view.replaceChildren(...fresh.childNodes);
  } catch (err) {
    const c = card('연결 실패');
    c.append(el('div', 'err', err.message));
    const retry = el('button', 'submit', '다시 시도');
    retry.onclick = () => { DATA = null; render(); };
    c.append(retry);
    view.replaceChildren(c);
  }
}

(function boot() {
  const nav = document.getElementById('tabs');
  PRIMARY.forEach(id => {
    const t = TAB[id];
    const b = el('button', id === current ? 'on' : '');
    b.dataset.tab = id;
    b.append(el('span', 'ti', t.emo), el('span', null, t.name));
    b.onclick = () => goTab(id);
    nav.append(b);
  });
  const more = el('button');
  more.dataset.tab = 'more';
  more.append(el('span', 'ti', '☰'), el('span', null, '더보기'));
  more.onclick = openMore;
  nav.append(more);

  document.getElementById('fab').onclick = () => { if (DATA) openQuickAdd(DATA); };

  render();
})();
