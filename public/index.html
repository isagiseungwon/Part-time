<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>강승원 · 성장 기록</title>
<style>
  /* 색상은 dataviz 검증기 통과값. 파랑=진행, 주황=연속기록, 청록=완료.
     세 색은 all-pairs 색맹 분리 ΔE 9.4 / 일반 20.9 로 통과한다. */
  :root {
    color-scheme: dark;
    --page:      #0d0d12;
    --card:      #16161d;
    --raised:    #1e1e28;
    --line:      #272733;
    --track:     #313142;  /* 진행 트랙. 카드 위에서 확실히 보여야 링이 링으로 읽힌다 */
    --text:      #f4f4f8;
    --muted:     #9c9cab;
    --faint:     #6b6b7a;

    --accent:    #3987e5;  /* 진행 */
    --streak:    #d95926;  /* 연속 */
    --done:      #199e70;  /* 완료 */
    --urgent:    #d03b3b;  /* 마감 임박 */

    --heat-0:    #1c1c25;
    --heat-1:    #1c5cab;
    --heat-2:    #256abf;
    --heat-3:    #3987e5;
    --heat-4:    #86b6ef;

    --r:         16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 96px;
    overscroll-behavior-y: contain;
  }

  /* ---------- 헤더 ---------- */

  header {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
  .bar h1 { margin: 0; font-size: .95rem; font-weight: 600; letter-spacing: -.01em; }
  .bar .spacer { flex: 1; }

  .streakchip {
    display: flex; align-items: center; gap: 5px;
    background: color-mix(in srgb, var(--streak) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--streak) 40%, transparent);
    color: var(--streak);
    border-radius: 999px; padding: 4px 11px;
    font-size: .78rem; font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  nav {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px;
    /* 오른쪽 페이드로 더 스크롤된다는 걸 알린다 */
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 28px), transparent 100%);
            mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 28px), transparent 100%);
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 0 0 auto; cursor: pointer; font-family: inherit;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: .82rem;
    transition: background .15s, color .15s;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  main { padding: 16px; display: grid; gap: 12px; }

  /* ---------- 카드 ---------- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
  }
  .card > h2 {
    margin: 0 0 14px; font-size: .8rem; font-weight: 650;
    color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
  }

  /* ---------- 레벨 히어로 ---------- */

  .hero { display: flex; align-items: center; gap: 16px; }
  .lvlring { position: relative; flex: 0 0 auto; }
  .lvlring .num {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .lvlring .num b { font-size: 1.7rem; font-weight: 700; letter-spacing: -.03em; }
  .lvlring .num span { font-size: .58rem; color: var(--faint); margin-top: 3px; letter-spacing: .1em; }

  .herobody { flex: 1; min-width: 0; }
  .herobody .xp { font-size: .95rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .herobody .next { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .xptrack { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .xpfill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* ---------- 퀘스트 ---------- */

  .quest {
    display: flex; align-items: center; gap: 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform .12s, border-color .15s;
  }
  .quest:last-child { margin-bottom: 0; }
  .quest:active { transform: scale(.985); }
  .quest .ico { font-size: 1.15rem; flex: 0 0 auto; width: 24px; text-align: center; }
  .quest .qt { flex: 1; min-width: 0; }
  .quest .qt .t { font-size: .88rem; font-weight: 550; }
  .quest .qt .s { font-size: .74rem; color: var(--faint); margin-top: 1px; }
  .quest .xpbadge {
    flex: 0 0 auto; font-size: .72rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .quest.cleared { border-color: color-mix(in srgb, var(--done) 45%, transparent); cursor: default; }
  .quest.cleared .qt .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .quest.cleared .xpbadge { color: var(--done); }

  /* ---------- 스탯 링 ---------- */

  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ringcell {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: var(--raised); border-radius: 12px; padding: 13px 6px 11px;
  }
  .ringcell .lab { font-size: .72rem; color: var(--muted); text-align: center; line-height: 1.25; }
  .ringcell .val { font-size: .68rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ringwrap { position: relative; }
  .ringwrap .pctxt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .ringwrap .emo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

  /* ---------- 히트맵 ---------- */

  .heat {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(7, 1fr); grid-auto-columns: 1fr;
    gap: 3px;
  }
  .heat i { width: auto; aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); display: block; }
  .heatlegend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 10px; font-size: .68rem; color: var(--faint); }
  .heatlegend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

  /* ---------- 업적 ---------- */

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .badge {
    background: var(--raised); border-radius: 12px; padding: 12px 8px;
    text-align: center; opacity: .32; filter: grayscale(1);
    transition: opacity .2s, filter .2s;
  }
  .badge.got { opacity: 1; filter: none; border: 1px solid color-mix(in srgb, var(--done) 35%, transparent); }
  .badge .e { font-size: 1.4rem; line-height: 1; }
  .badge .n { font-size: .68rem; margin-top: 6px; color: var(--muted); line-height: 1.25; }

  /* ---------- 리스트 아이템 ---------- */

  .item { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .item:last-child { border-bottom: none; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { font-size: .74rem; color: var(--faint); margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .dot.high { background: var(--urgent); }
  .dot.medium { background: var(--streak); }
  .dot.low { background: var(--faint); }

  .row { margin-bottom: 15px; }
  .row:last-child { margin-bottom: 0; }
  .rowtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .85rem; margin-bottom: 6px; }
  .rowtop .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowtop .v { color: var(--muted); flex: 0 0 auto; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
  .fill.full { background: var(--done); }

  /* ---------- 버튼 / 폼 ---------- */

  button.mini {
    background: var(--raised); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 12px; font-size: .78rem; font-family: inherit;
    cursor: pointer; flex: 0 0 auto;
  }
  button.mini:active { background: var(--line); }
  button.mini.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.mini.ok { background: var(--done); border-color: var(--done); color: #fff; font-weight: 600; }
  button.mini.danger { color: var(--urgent); }

  label { display: block; font-size: .76rem; color: var(--muted); margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; background: var(--raised); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px;
    font-size: 16px; font-family: inherit; /* 16px 미만이면 모바일에서 확대된다 */
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 68px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button.submit {
    width: 100%; margin-top: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 11px; padding: 13px;
    font-size: .93rem; font-weight: 650; font-family: inherit; cursor: pointer;
  }
  button.submit:disabled { opacity: .5; }

  details summary { cursor: pointer; font-size: .84rem; color: var(--accent); font-weight: 600; padding: 4px 0; list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  .empty { color: var(--faint); font-size: .83rem; padding: 4px 0; }
  .err { color: var(--urgent); font-size: .84rem; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 110px);
    background: var(--raised); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 999px; font-size: .85rem; font-weight: 550;
    transition: transform .3s cubic-bezier(.2,.8,.3,1); z-index: 60; max-width: 88vw; text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast.good { border-color: var(--done); color: var(--done); }
  #toast.bad { border-color: var(--urgent); color: var(--urgent); }

  @keyframes pop { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .pop { animation: pop .28s cubic-bezier(.2,.9,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>강승원 · 성장 기록</h1>
    <div class="spacer"></div>
    <div class="streakchip" id="streakchip">🔥 0일</div>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="view"></main>
<div id="toast"></div>

<script>
/* ============ 설정 ============ */

const TABS = [
  { id: 'home',     label: '홈' },
  { id: 'courses',  label: '📚 강의' },
  { id: 'fitness',  label: '💪 운동' },
  { id: 'books',    label: '📖 독서' },
  { id: 'mindpick', label: '📱 마인드픽' },
  { id: 'military', label: '🪖 군대' }
];

/* 행동 하나당 경험치 */
const XP = { lecture: 10, workout: 20, page: 0.5, post: 30, task: 25, book: 60 };

const ACHIEVEMENTS = [
  { id: 'first',    emo: '🌱', name: '첫 기록',        test: d => total(d) > 0 },
  { id: 'week',     emo: '🔥', name: '7일 연속',       test: d => streakOf(d) >= 7 },
  { id: 'month',    emo: '⚡', name: '30일 연속',      test: d => streakOf(d) >= 30 },
  { id: 'lift10',   emo: '💪', name: '운동 10회',      test: d => d.fitness.length >= 10 },
  { id: 'read1',    emo: '📖', name: '완독 1권',       test: d => d.books.filter(b => b.status === 'finished').length >= 1 },
  { id: 'read5',    emo: '📚', name: '완독 5권',       test: d => d.books.filter(b => b.status === 'finished').length >= 5 },
  { id: 'post10',   emo: '📱', name: '게시물 10개',    test: d => d.mindpick.length >= 10 },
  { id: 'course1',  emo: '🎓', name: '강의 완주',      test: d => d.courses.some(c => +c.total_lectures > 0 && +c.completed_lectures >= +c.total_lectures) },
  { id: 'army',     emo: '🪖', name: '군대 준비 완료', test: d => d.military.length > 0 && d.military.every(t => t.status === 'done') },
  { id: 'lvl5',     emo: '👑', name: '레벨 5',         test: d => levelOf(total(d)).level >= 5 }
];

/* ============ 유틸 ============ */

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const pct = (a, b) => (b ? Math.min(100, Math.round((a / b) * 100)) : 0);
const iso = (d) => d.toISOString().slice(0, 10);
const today = () => iso(new Date());
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const num = (v) => (v == null ? 0 : Number(v)).toLocaleString('ko-KR');

function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = kind ? kind : '';
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ 경험치 · 레벨 ============ */

function total(d) {
  let xp = 0;
  for (const c of d.courses)   xp += (+c.completed_lectures || 0) * XP.lecture;
  for (const f of d.fitness)   xp += XP.workout;
  for (const b of d.books) {
    xp += Math.round((+b.current_page || 0) * XP.page);
    if (b.status === 'finished') xp += XP.book;
  }
  for (const m of d.mindpick)  xp += XP.post;
  for (const t of d.military)  if (t.status === 'done') xp += XP.task;
  return Math.round(xp);
}

/* 레벨 N → N+1 에 필요한 경험치: 100 + (N-1)*60 */
function levelOf(xp) {
  let level = 1, rest = xp, need = 100;
  while (rest >= need) { rest -= need; level++; need = 100 + (level - 1) * 60; }
  return { level, into: rest, need };
}

/* ============ 활동일 · 연속 기록 ============ */

function activityMap(d) {
  const m = new Map();
  const add = (v) => {
    if (!v) return;
    const day = String(v).slice(0, 10);
    m.set(day, (m.get(day) || 0) + 1);
  };
  d.fitness.forEach(r => add(r.date));
  d.mindpick.forEach(r => add(r.post_date));
  d.books.forEach(r => { add(r.finished_at); add(r.started_at); });
  d.military.forEach(r => add(r.completed_at));
  d.courses.forEach(r => add(r.created_at));
  return m;
}

function streakOf(d) {
  const m = activityMap(d);
  if (!m.size) return 0;
  // 오늘 아직 기록이 없어도 어제까지 이어졌으면 연속으로 친다.
  let cur = new Date();
  if (!m.has(iso(cur))) cur.setDate(cur.getDate() - 1);
  let n = 0;
  while (m.has(iso(cur))) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}

/* ============ API ============ */

const ENDPOINTS = ['courses', 'fitness', 'books', 'mindpick', 'military'];
let DATA = null;
let current = 'home';

async function api(path, options) {
  const res = await fetch('/api/' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

async function loadAll(force) {
  if (DATA && !force) return DATA;
  const lists = await Promise.all(ENDPOINTS.map(n => api(n)));
  DATA = {};
  ENDPOINTS.forEach((n, i) => { DATA[n] = Array.isArray(lists[i]) ? lists[i] : []; });
  return DATA;
}

async function save(name, body, msg) {
  await api(name, { method: 'POST', body: JSON.stringify(body) });
  DATA = null;
  toast(msg || '기록 완료', 'good');
  render();
}
async function patch(name, id, body, msg) {
  await api(`${name}?id=${id}`, { method: 'PATCH', body: JSON.stringify(body) });
  DATA = null;
  if (msg) toast(msg, 'good');
  render();
}
async function remove(name, id, label) {
  if (!confirm(`"${label}" 삭제할까?`)) return;
  await api(`${name}?id=${id}`, { method: 'DELETE' });
  DATA = null;
  toast('삭제했어');
  render();
}

/* ============ 조각 ============ */

function card(title) {
  const c = el('div', 'card');
  if (title) c.append(el('h2', null, title));
  return c;
}

/* 진행률 링. 크기(px)와 굵기만 받는다. */
function ring(value, size, width, color) {
  const r = (size - width) / 2;
  const circ = 2 * Math.PI * r;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.style.display = 'block';
  svg.style.transform = 'rotate(-90deg)';

  const bg = document.createElementNS(ns, 'circle');
  bg.setAttribute('cx', size / 2); bg.setAttribute('cy', size / 2); bg.setAttribute('r', r);
  bg.setAttribute('fill', 'none');
  bg.setAttribute('stroke', 'var(--track)');
  bg.setAttribute('stroke-width', width);

  const fg = document.createElementNS(ns, 'circle');
  fg.setAttribute('cx', size / 2); fg.setAttribute('cy', size / 2); fg.setAttribute('r', r);
  fg.setAttribute('fill', 'none');
  fg.setAttribute('stroke', color || (value >= 100 ? 'var(--done)' : 'var(--accent)'));
  fg.setAttribute('stroke-width', width);
  fg.setAttribute('stroke-linecap', 'round');
  fg.setAttribute('stroke-dasharray', circ);
  fg.setAttribute('stroke-dashoffset', circ * (1 - Math.min(1, value / 100)));
  fg.style.transition = 'stroke-dashoffset .6s cubic-bezier(.2,.7,.3,1)';

  svg.append(bg, fg);
  return svg;
}

function bar(parent, name, done, tot, valueText) {
  const row = el('div', 'row');
  const top = el('div', 'rowtop');
  top.append(el('span', 'n', name), el('span', 'v', valueText ?? `${done} / ${tot}`));
  const track = el('div', 'track');
  const f = el('div', 'fill');
  const p = pct(done, tot);
  f.style.width = p + '%';
  if (p >= 100) f.classList.add('full');
  track.append(f);
  row.append(top, track);
  parent.append(row);
  return row;
}

function form(fields, onSubmit, submitLabel) {
  const wrap = el('div');
  const inputs = {};
  const build = (f) => {
    const holder = el('div');
    holder.append(el('label', null, f.label));
    let input;
    if (f.type === 'select') {
      input = el('select');
      f.options.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; input.append(o); });
    } else if (f.type === 'textarea') {
      input = el('textarea');
    } else {
      input = el('input');
      input.type = f.type || 'text';
      if (f.step) input.step = f.step;
      if (f.type === 'number') input.inputMode = 'decimal';
    }
    if (f.value !== undefined) input.value = f.value;
    if (f.placeholder) input.placeholder = f.placeholder;
    inputs[f.key] = input;
    holder.append(input);
    return holder;
  };
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i], next = fields[i + 1];
    if (f.half && next && next.half) {
      const pair = el('div', 'two');
      pair.append(build(f), build(next));
      wrap.append(pair);
      i++;
    } else wrap.append(build(f));
  }
  const btn = el('button', 'submit', submitLabel || '추가');
  btn.onclick = async () => {
    const body = {};
    for (const [k, input] of Object.entries(inputs)) {
      const v = input.value.trim();
      if (v !== '') body[k] = v;
    }
    btn.disabled = true; btn.textContent = '저장 중…';
    try { await onSubmit(body); }
    catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = submitLabel || '추가'; }
  };
  wrap.append(btn);
  return wrap;
}

function collapsed(title, node, open) {
  const d = el('details');
  if (open) d.open = true;
  d.append(el('summary', null, title), node);
  return d;
}

function goTab(id) {
  current = id;
  const nav = document.getElementById('tabs');
  [...nav.children].forEach((n, i) => n.classList.toggle('on', TABS[i].id === current));
  window.scrollTo({ top: 0 });
  render();
}

/* 오늘 할 만한 것을 데이터에서 뽑아낸다. */
function quests(d) {
  const t = today();
  const out = [];

  const course = d.courses.find(c => c.status !== 'done' && (+c.completed_lectures || 0) < (+c.total_lectures || 0));
  if (course) {
    out.push({
      emo: '📚', xp: XP.lecture,
      title: '강의 1강 듣기',
      sub: `${course.name} · ${course.completed_lectures || 0}/${course.total_lectures}강`,
      done: false,
      act: () => patch('courses', course.id, {
        completed_lectures: (+course.completed_lectures || 0) + 1,
        status: (+course.completed_lectures || 0) + 1 >= (+course.total_lectures || 0) ? 'done' : 'in_progress'
      }, `+${XP.lecture} XP`)
    });
  }

  const trained = d.fitness.some(f => f.date === t);
  out.push({
    emo: '💪', xp: XP.workout,
    title: '오늘 운동 기록',
    sub: trained ? '오늘 기록함' : '체중이나 운동 남기기',
    done: trained,
    act: () => goTab('fitness')
  });

  const reading = d.books.find(b => b.status === 'reading');
  if (reading) {
    out.push({
      emo: '📖', xp: 5,
      title: '10쪽 읽기',
      sub: `${reading.title} · ${reading.current_page || 0}쪽`,
      done: false,
      act: () => patch('books', reading.id, { current_page: (+reading.current_page || 0) + 10 }, '+5 XP')
    });
  }

  const posted = d.mindpick.some(m => m.post_date === t);
  out.push({
    emo: '📱', xp: XP.post,
    title: '마인드픽 1개 올리기',
    sub: posted ? '오늘 올림' : '릴스든 카드뉴스든 하나',
    done: posted,
    act: () => goTab('mindpick')
  });

  const task = d.military
    .filter(x => x.status !== 'done')
    .sort((a, b) => (a.target_date || '9999').localeCompare(b.target_date || '9999'))[0];
  if (task) {
    out.push({
      emo: '🪖', xp: XP.task,
      title: task.task,
      sub: task.target_date ? `목표 ${task.target_date}` : '군대 준비',
      done: false,
      act: () => patch('military', task.id, { status: 'done', completed_at: new Date().toISOString() }, `+${XP.task} XP`)
    });
  }

  return out;
}

function stats(d) {
  const doneL = d.courses.reduce((s, c) => s + (+c.completed_lectures || 0), 0);
  const totL  = d.courses.reduce((s, c) => s + (+c.total_lectures || 0), 0);
  const week  = d.fitness.filter(f => f.date >= daysAgo(6)).length;
  const reading = d.books.filter(b => b.status === 'reading');
  const readPct = reading.length
    ? Math.round(reading.reduce((s, b) => s + pct(+b.current_page || 0, +b.total_pages || 0), 0) / reading.length)
    : null;
  const month = d.mindpick.filter(m => m.post_date >= daysAgo(29)).length;
  const mDone = d.military.filter(x => x.status === 'done').length;

  return [
    { emo: '📚', label: '강의',    pct: totL ? pct(doneL, totL) : null,       detail: totL ? `${doneL}/${totL}강` : '없음' },
    { emo: '💪', label: '운동',    pct: pct(week, 7),                          detail: `주 ${week}일` },
    { emo: '📖', label: '독서',    pct: readPct,                               detail: reading.length ? `${reading.length}권 읽는 중` : '없음' },
    { emo: '📱', label: '마인드픽', pct: pct(month, 12),                        detail: `30일 ${month}개` },
    { emo: '🪖', label: '군대',    pct: d.military.length ? pct(mDone, d.military.length) : null, detail: d.military.length ? `${mDone}/${d.military.length}` : '없음' },
    { emo: '🔥', label: '연속',    pct: pct(streakOf(d), 30),                  detail: `${streakOf(d)}일` }
  ];
}

  try {
    const d = await loadAll();
    document.getElementById('streakchip').textContent = `🔥 ${streakOf(d)}일`;
    const fresh = document.createElement('div');
    VIEWS[current](fresh, d);
    view.replaceChildren(...fresh.childNodes);
  } catch (err) {
    const c = card('연결 실패');
    c.append(el('div', 'err', err.message));
    const retry = el('button', 'submit', '다시 시도');
    retry.onclick = () => { DATA = null; render(); };
    c.append(retry);
    view.replaceChildren(c);
  }
}

(function boot() {
  const nav = document.getElementById('tabs');
  TABS.forEach(t => {
    const b = el('button', t.id === current ? 'on' : '', t.label);
    b.onclick = () => goTab(t.id);
    nav.append(b);
  });
  render();
})();
</script>
</body>
</html>
